<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Knits.js tests</title>
<style>
  body { font: 14px/1.4 Menlo, Consolas, monospace; background:#111; color:#eee; padding:16px; }
  .pass { color:#7bd389; }
  .fail { color:#ff6b6b; background:#2a1414; }
  .group { margin-top:18px; font-weight:bold; color:#9cf; border-bottom:1px solid #333; padding-bottom:4px; }
  #summary { margin-top:20px; font-size:18px; font-weight:bold; }
  #summary.ok { color:#7bd389; }
  #summary.bad { color:#ff6b6b; }
</style>
</head>
<body>
<h1>Knits.js test suite</h1>
<div id="out"></div>
<div id="summary"></div>

<script src="../js/patterns.js"></script>
<script>
  // until the shell adds js/knits.js to index.html, the page loads it itself
  if (!window.Knits) document.write('<script src="../js/knits.js"><\/script>');
</script>
<script>
'use strict';

var out = document.getElementById('out');
var passed = 0, failed = 0;
var K = window.Knits, P = window.Patterns;

function log(ok, label, detail) {
  if (ok) passed++; else failed++;
  var div = document.createElement('div');
  div.className = ok ? 'pass' : 'fail';
  div.textContent = (ok ? 'PASS' : 'FAIL') + ' - ' + label + (detail ? '  (' + detail + ')' : '');
  out.appendChild(div);
  if (!ok) console.error(div.textContent);
}
function group(title) {
  var div = document.createElement('div');
  div.className = 'group';
  div.textContent = title;
  out.appendChild(div);
}
function deepEqual(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function eq(actual, expected, label) {
  var ok = deepEqual(actual, expected);
  log(ok, label, ok ? '' : 'expected ' + JSON.stringify(expected) + ' got ' + JSON.stringify(actual));
}
function ok(cond, label, detail) { log(!!cond, label, cond ? '' : detail); }
function pick(o, keys) { var r = {}; keys.forEach(function (k) { r[k] = o ? o[k] : undefined; }); return r; }
function lineWith(lines, sub) {
  for (var i = 0; i < lines.length; i++) if (String(lines[i].text).indexOf(sub) >= 0) return lines[i];
  return null;
}
function rowLine(lines, n) {
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (l.row !== null && l.row >= 1 && (l.rowList ? l.rowList.indexOf(n) >= 0 : (n >= l.row && n <= l.rowEnd))) return l;
  }
  return null;
}

try {

// -----------------------------------------------------------------------
group('API: every Patterns function, same name and arity');
// -----------------------------------------------------------------------
ok(K && typeof K === 'object', 'window.Knits exists');
Object.keys(P).forEach(function (k) {
  if (k === 'createParser' || k === 'profile') return;
  var v = P[k];
  if (typeof v === 'function') {
    ok(typeof K[k] === 'function' && K[k].length === v.length, 'Knits.' + k + ' is a function of ' + v.length,
      typeof K[k] + '/' + (K[k] && K[k].length));
  } else {
    ok(K[k] !== undefined, 'Knits.' + k + ' is present');
  }
});
eq(K.craft, 'knitting', 'Knits.craft');
eq(P.craft, 'crochet', 'Patterns.craft');
ok(/knitting/.test(K.version) && /crochet/.test(P.version) && K.version !== P.version, 'version names the craft');
ok(typeof K.glossary === 'function', 'Knits.glossary');
ok(typeof P.createParser === 'function', 'Patterns.createParser');

// -----------------------------------------------------------------------
group('engine: VOCAB entries may be functions of the match');
// -----------------------------------------------------------------------
var TP = P.createParser({ vocab: [['zz(\\d+)', function (m) { return +m[1]; }, function (m) { return +m[1]; }], ['sc', 1, 1]] });
eq(TP.evaluate('zz6, sc', null), 7, 'a function-valued entry counts its digits (zz6 = 6)');
eq(TP.evaluate('2 sc, zz4', null), 6, 'and still works beside a plain entry');
eq(P.evaluate('6 sc in magic ring'), 6, 'the crochet instance is unchanged');

// -----------------------------------------------------------------------
group('the twelve lines (lens §1.3)');
// -----------------------------------------------------------------------
// 1
var t1 = 'CO 60 sts.\nRow 1 (RS): K2, *yo, k2tog, k3; rep from * to last 3 sts, k3. (60 sts)';
var L1 = rowLine(K.parse(t1), 1);
eq(pick(L1, ['kind', 'row', 'side', 'count', 'countSource', 'computed']),
  { kind: 'row', row: 1, side: 'rs', count: 60, countSource: 'explicit', computed: 60 },
  '#1 row 1 RS, asterisk group + 3-st remainder, 60 explicit (and computed 60)');
eq(K.evaluate('K2, *yo, k2tog, k3; rep from * to last 3 sts, k3.', 62), null,
  '#1 trap: a remainder that does not fit the stitches is not guessed (62 = 2 + 5n + 3 has no n)');
eq(K.evaluate('K2, *yo, k2tog, k3; rep from * to last 3 sts, k3.', 65), 65, '#1 with 65 sts: 12 repeats');

// 2
var t2 = t1 + '\nRows 2, 4, 6 and 8 (WS): Purl.\nRows 3, 5 and 7 (RS): Knit.';
var p2 = K.parse(t2);
var L2 = lineWith(p2, 'Rows 2, 4');
eq(pick(L2, ['kind', 'row', 'rowEnd', 'rowList', 'side', 'computed']),
  { kind: 'row', row: 2, rowEnd: 8, rowList: [2, 4, 6, 8], side: 'ws', computed: 60 },
  '#2 four rows (not a range), WS, computed = prev');
eq(K.lineFor(p2, 3).text, 'Rows 3, 5 and 7 (RS): Knit.', '#2 lineFor(3) is the odd-row line, not the even enumeration');
eq(K.lineFor(p2, 6).text, 'Rows 2, 4, 6 and 8 (WS): Purl.', '#2 lineFor(6) is the even enumeration');
eq(K.summary(p2).rows, 8, '#2 summary counts 1 + 4 + 3 = 8 rows');
eq(K.parse(t2).meta.sections.length, 1, '#2 the interleaved enumerations stay one section');
eq(K.countReport(p2).rows, 8, '#2 countReport counts the listed rows');

// 3
var t3 = 'Sizes XS (S, M, L, XL)\nCO 60 (66, 72, 78, 84) sts. Join to work in the rnd.\nRnds 1-12: Knit.\n' +
  'Rnd 13: K1, m1L, knit to last st, m1R, k1 — 62 (68, 74, 80, 86) sts.';
var L3 = lineWith(K.parse(t3), 'Rnd 13');
eq(pick(L3, ['row', 'side', 'count', 'countSource', 'computed', 'sizes']),
  { row: 13, side: null, count: 62, countSource: 'explicit', computed: 62, sizes: [62, 68, 74, 80, 86] },
  '#3 row 13 in the round, em-dash multi-size count, computed agrees');
var L3b = lineWith(K.parse(t3, { size: 3 }), 'Rnd 13');
eq(pick(L3b, ['count', 'computed']), { count: 80, computed: 80 }, '#3 size L resolves to 80 (78 + 2)');

// 4
var t4 = 'Set-up row (WS): P3, pm, p12, pm, p30, pm, p12, pm, p3.';
var L4 = K.parse(t4)[0];
eq(pick(L4, ['kind', 'row', 'count', 'side']), { kind: 'setup', row: 0, count: 60, side: 'ws' }, '#4 set-up row, count 60, WS');
eq((L4.markers || []).map(function (m) { return m.at; }), [3, 15, 45, 57], '#4 four markers at 3/15/45/57');

// 5
var t5 = 'CO 100 sts, pm for beg of rnd and join to work in the rnd.\nRnd 1: Knit.\n' +
  'Raglan inc rnd: *K1, m1L, knit to 1 st before marker, m1R, k1, sm; rep from * 3 more times — 8 sts inc.';
var p5 = K.parse(t5);
var L5 = lineWith(p5, 'Raglan inc');
eq(pick(L5, ['kind', 'row', 'delta', 'count', 'computed']), { kind: 'row', row: 2, delta: 8, count: 108, computed: 108 },
  '#5 delta +8, count = prev + 8, marker-relative fill is not null');
ok(L5.stitches === null, '#5 "8 sts inc" is not read as a total of 8');
eq(lineWith(p5, 'CO 100').markers, [{ name: 'BOR', at: 0 }], '#5 the cast-on line places the BOR marker');

// 6
var t6 = 'Sizes XS (S, M, L, XL)\nCO 120 (136, 152, 168, 184) sts. Join to work in the rnd.\n' +
  'Rnds 1-12: Knit.\nRnd 13: *K1, m1, knit to marker, sm; rep from * 3 more times — 4 sts inc.\nRnd 14: Knit.\n' +
  'Repeat Rnds 13–14 a further 9 (11, 13, 15, 17) times — 160 (184, 208, 232, 256) sts.';
var p6 = K.parse(t6);
var L6 = lineWith(p6, 'Repeat Rnds');
eq(pick(L6, ['kind', 'repeatOf', 'repeatTimes', 'repeatMore', 'count']),
  { kind: 'repeat', repeatOf: [13, 14], repeatTimes: 10, repeatMore: true, count: 160 },
  '#6 repeat of rnds 13-14, "a further 9" = 9 more (times 10 counts the written one), size-resolved count');
var s6 = K.summary(p6).suggestions.repeat;
eq(s6, { startRow: 13, endRow: 14, times: 10, untilRows: null }, '#6 summary suggestion {startRow:13,endRow:14,times}');
var p6b = K.parse(t6, { size: 2 });
eq(pick(lineWith(p6b, 'Repeat Rnds'), ['repeatTimes', 'count']), { repeatTimes: 14, count: 208 }, '#6 size M: 13 more, 208 sts');
eq(K.summary(p6).maxRow, 32, '#6 the piece runs to rnd 32 (14 + 9 x 2): a counted repeat grows rows');
eq([K.targetFor(p6, 15), K.targetFor(p6, 16), K.targetFor(p6, 29), K.targetFor(p6, 32)], [128, 128, 156, 160],
  '#6 every repeated rnd has its own count: the shaping keeps going, the printed total is the last');

// 7 + 8
var t7 = 'Sizes S (L)\nHeel flap: CO 36 (40) sts.\nRow 1 (RS): *Sl 1, k1; rep from * to end.\nRow 2 (WS): Sl 1, purl to end.\n' +
  'Heel turn Row 1 (RS): Sl1, k17 (19), ssk, k1, turn.\nRow 2 (WS): Sl1, p to one st before the gap, p2tog, p1, turn.\n' +
  'Row 3 (RS): Sl1, k to 1 st before gap, ssk, k1, turn.';
var p7 = K.parse(t7);
var L7 = lineWith(p7, 'Heel turn Row 1');
eq(pick(L7, ['kind', 'row', 'side', 'stitches', 'shortRow', 'computed']),
  { kind: 'row', row: 1, side: 'rs', stitches: null, shortRow: true, computed: 35 },
  '#7 (19) is an in-segment size, not a total; turn = short row; 36 - 1 on the needles');
ok(K.parse(t7).meta.sections.some(function (s) { return s.name === 'Heel Turn'; }), '#7 the label names the part (Heel Turn)');
var L7b = lineWith(K.parse(t7, { size: 1 }), 'Heel turn Row 1');
eq(pick(L7b, ['stitches', 'computed']), { stitches: null, computed: 39 }, '#7 size L: k19, 40 - 1');
var L8 = lineWith(p7, 'Row 2 (WS): Sl1, p to one');
eq(pick(L8, ['row', 'side', 'computed', 'count', 'shortRow']), { row: 2, side: 'ws', computed: null, count: null, shortRow: true },
  '#8 gap-relative: computed null - never guess');
eq(lineWith(p7, 'Row 3 (RS): Sl1, k to 1').computed, null, '#8 ...and the row after it is not counted from a stale number');

// 9
var t9 = 'CO 96 sts. Join.\nRnds 1-24: Knit.\nRnd 25: [K6, C6F] 8 times. (96 sts)';
var L9 = lineWith(K.parse(t9), 'Rnd 25');
eq(pick(L9, ['row', 'count', 'countSource', 'computed']), { row: 25, count: 96, countSource: 'explicit', computed: 96 },
  '#9 bracket x8, C6F = 6 for 6, explicit 96');
eq(K.evaluate('[K6, C6F] 8 times.', null), 96, '#9 C6F counts its 6 stitches');
eq(K.evaluate('*P2, C4B; rep from * to end', 36), 36, '#9 C4B in an asterisk repeat');
eq(K.evaluate('k2, 2/2 RC, k2', 8), 8, '#9 2/2 RC = 4 stitches');

// 10
var t10 = 'Sizes S (M, L, XL)\nCO 80 (88, 96, 104) sts.\nRow 1: Knit.\nRow 2: Purl.\n' +
  'Work even in St st until piece measures 32 (33, 34, 35) cm / 12½ (13, 13½, 13¾)" from underarm, ending with a WS row.';
var p10 = K.parse(t10, { size: 1 });
var L10 = lineWith(p10, 'Work even');
eq(L10.until, { kind: 'length', value: 33, unit: 'cm', endOn: 'ws' }, '#10 until 33 cm (size M), end on WS');
ok(L10.row === null, '#10 no row number');
eq(K.summary(p10).suggestions.targetRows, null, '#10 never a targetRows suggestion');
ok(!(L10.repeatTo >= 1) && !(L10.repeatRows >= 1), '#10 the length grows no rows');

// 11
var t11 = 'CO 60 sts.\nRow 1 (WS): Purl.\nNext row (RS): BO 4 sts, work to end — 56 sts rem.';
var L11 = lineWith(K.parse(t11), 'Next row');
eq(pick(L11, ['row', 'side', 'count', 'countSource', 'computed']), { row: 2, side: 'rs', count: 56, countSource: 'explicit', computed: 56 },
  '#11 Next row = prev + 1, BO 4 = -4, "56 sts rem" explicit');

// 12
var t12 = 'Sizes S (M, L, XL)\nCO 40 (44, 48, 52) sts.\nRow 1: Purl.\nSizes S (M, L) only: K2tog at each end of next row.\nRow 3: Purl.';
[0, 1, 2].forEach(function (sz) {
  var l = lineWith(K.parse(t12, { size: sz }), 'Sizes S (M, L) only');
  ok(l && l.kind === 'row' && !l.sizeSkip, '#12 kept for size ' + sz, l && (l.kind + '/' + l.sizeSkip));
});
var l12 = lineWith(K.parse(t12, { size: 0 }), 'Sizes S (M, L) only');
eq(pick(l12, ['row', 'computed']), { row: 2, computed: 38 }, '#12 ...as next row, a k2tog at each end: -2');
var l12x = lineWith(K.parse(t12, { size: 3 }), 'Sizes S (M, L) only');
ok(l12x && l12x.kind === 'note' && l12x.sizeSkip === true, '#12 dropped for size XL', l12x && l12x.kind);
eq(K.sizeScope('Sizes S (M, L) only:', ['S', 'M', 'L', 'XL']), { indices: [0, 1, 2], label: true }, '#12 sizeScope reads "S (M, L)"');

// -----------------------------------------------------------------------
group('traps');
// -----------------------------------------------------------------------
var tCo = 'Sizes S (M, L)\nCO 60 (66, 72) sts.\nRow 1: Knit.';
eq(pick(K.parse(tCo, { size: 1 })[1], ['kind', 'count', 'sizes']), { kind: 'setup', count: 66, sizes: [60, 66, 72] },
  'CO 60 (66, 72) sts: an in-segment size list, size M = 66');
eq(K.evaluate('CO 60 (66, 72) sts', null), 60, 'evaluate on the cast-on alone (size 0)');
var tHead = 'Cast On\nCO 20 sts.\nRow 1: Knit.\nRow 2: Purl.\nBind Off\nBO all sts.';
var sec = K.splitSections(tHead).map(function (s) { return s.name; });
ok(sec.indexOf('Cast On') < 0 && sec.indexOf('Bind Off') < 0, '"Cast On" / "Bind Off" never part headers', JSON.stringify(sec));
var tHead2 = 'BACK\nCast On\nCO 20 sts.\nRow 1: Knit.\nBind Off\nBO all sts.\nFRONT\nCO 20 sts.\nRow 1: Knit.';
eq(K.splitSections(tHead2).map(function (s) { return s.name; }), ['Back', 'Front'], '...and the parts around them keep their names');
eq(K.detectSizes('34 (38, 42, 46)'), ['34', '38', '42', '46'], 'numeric size line "34 (38, 42, 46)" detected');
eq(K.detectSizes('To fit chest 34 (38, 42, 46)" \nCO 20 sts.'), ['34"', '38"', '42"', '46"'], 'numeric size line with a label and unit');
eq(P.detectSizes('34 (38, 42, 46)'), null, '(crochet still refuses a numeric size line)');
var tG = 'GAUGE\n22 sts and 30 rows = 4" (10 cm) in St st.\nCO 60 sts.\nRow 1: Knit.';
var pG = K.parse(tG);
eq(pG.filter(function (l) { return l.kind === 'setup'; }).map(function (l) { return l.text; }), ['CO 60 sts.'],
  'the gauge line is never a setup row; the cast-on is');
eq(lineWith(pG, '22 sts and 30 rows').count, null, 'the gauge line has no count');
var tG2 = 'Gauge: 22 sts = 10 cm\nNeedles: 4 mm (US 6)\nCO 30 sts.\nRow 1: Knit.';
eq(K.parse(tG2).filter(function (l) { return l.kind === 'setup'; }).length, 1, 'gauge/needle lines: one setup (the cast-on)');

// -----------------------------------------------------------------------
group('in-segment sizes');
// -----------------------------------------------------------------------
eq(K.evaluate('K4 (4-4-4-6-6). PM. K2.', null), 6, 'hyphen lists, size 0 (Yarnspirations)');
var tH = 'Sizes XS/S (M-L-XL-2/3XL-4/5XL)\nCast on 36 (38-38-40-44-46) sts.\n' +
  '1st row:(RS). K1. PM. K2. PM. K4 (4-4-4-6-6). PM. K2. PM. K18 (20-20-22-22-24). PM. K2. PM. K4 (4-4-4-6-6). PM. K2. PM. K1.';
[0, 4].forEach(function (sz) {
  var l = lineWith(K.parse(tH, { size: sz }), '1st row');
  var want = [36, 38, 38, 40, 44, 46][sz];
  eq(pick(l, ['row', 'side', 'computed', 'stitches']), { row: 1, side: 'rs', computed: want, stitches: null },
    'Bernat 1st row, size ' + sz + ': computed ' + want + ', no phantom total');
});
eq(lineWith(K.parse(tH), '1st row').markers.map(function (m) { return m.at; }), [1, 3, 7, 9, 27, 29, 33, 35], 'Bernat 1st row: 8 markers (XS/S)');
eq(lineWith(K.parse(tH, { size: 4 }), '1st row').markers.map(function (m) { return m.at; }), [1, 3, 9, 11, 33, 35, 41, 43], '...and at 2/3XL');
eq(K.evaluate('Sl1, k17 (19, 21), ssk, k1, turn.', 40), 39, 'a three-size list resolves (size 0)');
ok(K.evaluate('K17 (19, 21), k2tog', 40) === null, 'a row that stops short of the end without turning is not a total');
var tMis = 'Sizes S (M, L)\nCO 40 (44, 48) sts.\nRow 1: K17 (19), knit to end.';
eq(lineWith(K.parse(tMis, { size: 1 }), 'Row 1').computed, null, 'a 2-number list in a 3-size document says nothing');
eq(K.parse('Sizes S (M, L)\nRow 1: Sl1, k17 (19), ssk, k1, turn. (36 sts)', { size: 0 })[1].stitches, 36,
  'a real total after an in-segment list still reads');

// -----------------------------------------------------------------------
group('asterisk repeats');
// -----------------------------------------------------------------------
eq(K.evaluate('*K2, p2; rep from * to end.', 40), 40, 'rib to end');
eq(K.evaluate('*K2, p2; rep from * to end.', 42), null, '42 does not divide by 4: null, never a guess');
eq(K.evaluate('K1, *k2tog, yo; rep from * to last st, k1.', 30), 30, 'lace eyelets to last st');
eq(K.evaluate('*K2tog; rep from * to end.', 30), 15, 'k2tog to end halves');
eq(K.evaluate('K2tog to end.', 30), 15, '"K2tog to end" is a fill');
eq(K.evaluate('*K1, k2tog; rep from * around.', 30), 20, 'rep from * around');
eq(K.evaluate('K1, *yo, p2tog; rep from * to end, yo', 51), 52, 'Time Traveler eyelet rnd: 51 -> 52');
eq(K.evaluate('K1. *M1. SM. K2. SM. M1. K4. M1. SM. K2. SM. M1.** Knit to next marker. Rep from * to ** once more. K1.', 36), 44,
  'Bernat 3rd row: * to ** once more = +8');
eq(K.evaluate('Knit to first marker. *M1. SM. K2. SM. M1. Knit to next marker. M1. SM. K2. SM. M1.** Knit to next marker. Rep from * to ** once more. Knit to end of row.', 44), 52,
  'Bernat 5th row: +8 with three marker fills');
eq(K.evaluate('Knit to next marker. *M1. SM. K2. SM. M1.** Knit to next marker. Rep from * twice more, then from * to ** once. Knit to end of rnd.', 76), 84,
  'Bernat 2nd rnd: "twice more, then from * to ** once" = 4 workings, +8');
eq(K.evaluate('*K1, ssk, knit to 3 sts before m, k2tog, k1; rep from * once more', 56), 52, 'sock toe: -4');
eq(K.evaluate('(Knit to next marker. M1. SM. K2. SM. Knit to next marker. SM. K2. SM. M1) twice. Knit to end of rnd.', 252), 256,
  'parenthesised group x twice');
eq(K.evaluate('*K1tbl. P1. Rep from * around.', 120), 120, 'twisted rib around');
eq(K.evaluate('*K2, p2; rep from * 3 more times.', 16), 16, 'N more times');
eq(K.evaluate('*k3, p1; rep from * to marker, sm, knit to end', 50), 50, 'a neutral repeat to a marker still counts');
eq(K.evaluate('*k2tog; rep from * to marker, knit to end', 50), null, 'a shaping repeat to a marker cannot be counted');

// -----------------------------------------------------------------------
group('stitch vocabulary');
// -----------------------------------------------------------------------
[
  ['k2tog, ssk, k3tog, sssk, cdd', 13, 5],
  ['yo, m1, m1L, m1R, m1p, kfb, pfb', 2, 9],
  ['sl1, k1, psso', 2, 1],
  ['sl 1, k2tog, psso', 3, 1],
  ['s2kp', 3, 1],
  ['k1tbl, p1tbl, k2tog tbl', 4, 3],
  ['Sl 1 pwise wyb, k1', 2, 2],
  ['sl 1 kwise with yarn in back (wyb), k16, ssk, turn', 19, 18],
  ['C4F, C4B, T3R, 1/1 LC', 13, 13],
  ['MB, k3', 4, 4],
  ['pick up and knit 16 sts along edge of heel flap', 0, 16],
  ['BO 4 sts, k to end', 20, 16]
].forEach(function (c) {
  var r = K.readInstruction(c[0], c[1]);
  eq(r.count, c[2], '"' + c[0] + '" from ' + c[1]);
});
eq(K.evaluate('Purl.', 24), 24, '"Purl." is the whole row');
eq(K.evaluate('Knit.', null), null, '"Knit." with nothing to go on is not a count');
eq(K.evaluate('Work even.', 30), 30, '"Work even."');
eq(K.evaluate('Work in patt to m, sl m, knit to m, M1, sl m, knit to m, sl m, M1, knit to end', 64), 66, 'gusset inc rnd +2');
eq(K.evaluate('K2tog. Knit to last 2 sts. ssk.', 46), 44, 'Bernat sleeve dec');
eq(K.evaluate('Cast on 16 (18-18-20-20-22) st (center front). Join to beg working in rnds.', 60), 76,
  'casting on in a row adds to it (+16)');

// -----------------------------------------------------------------------
group('markers, short rows, charts, cables, until, delta');
// -----------------------------------------------------------------------
eq(K.readInstruction('K1, pm, k10, pm, k1', null).markers, [{ name: 'm1', at: 1 }, { name: 'm2', at: 11 }], 'pm positions');
eq(K.readInstruction('K11, remove m, k10, remove m, k11, pm for end of instep, knit to end', 56).markers,
  [{ name: 'end of instep', at: 32 }], '"pm for end of instep" is named');
eq(K.readInstruction('Knit to m, remove m, knit to last 7 sts, pm for new beg of rnd.', 51).markers,
  [{ name: 'BOR', at: 0 }], 'a new beginning-of-round marker is BOR');
var tSR = 'Short-row 1 (RS) K25 (32, 37), wrap next st, turn.\nShort-row 2 (WS) P16 (18, 22), wrap next st, turn.';
var pSR = K.parse(tSR);
eq(pSR.map(function (l) { return pick(l, ['row', 'side', 'shortRow']); }),
  [{ row: 1, side: 'rs', shortRow: true }, { row: 2, side: 'ws', shortRow: true }], 'Short-row N lines are rows with shortRow');
ok(lineWith(K.parse('Row 1: K5, w&t.'), 'Row 1').shortRow, 'w&t is a short row');
ok(!lineWith(K.parse('Row 1: Knit to end.'), 'Row 1').shortRow, 'a full row is not');
eq(lineWith(K.parse('Rnd 5: K0 (1, 3), work Row 1 of Foot chart over 32 sts, k0 (1, 3), sl m, knit to end.'), 'Rnd 5').chart,
  { name: 'Foot', row: 1 }, 'chart: "Row 1 of Foot chart"');
eq(lineWith(K.parse('Row 7: work row 7 of Chart A.'), 'Row 7').chart, { name: 'A', row: 7 }, 'chart: "row 7 of Chart A"');
