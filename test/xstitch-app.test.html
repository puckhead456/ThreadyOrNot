<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-stitch app tests</title>
<style>
  body { margin: 0; background: #111; }
  #log { font: 13px/1.4 Menlo, Consolas, monospace; background:#111; color:#eee; padding:12px; }
  .pass { color:#7bd389; } .fail { color:#ff6b6b; background:#2a1414; } .note { color:#c9a227; }
  .group { margin-top:14px; font-weight:bold; color:#9cf; border-bottom:1px solid #333; }
  #summary { margin-top:16px; font-size:17px; font-weight:bold; } #summary.ok { color:#7bd389; } #summary.bad { color:#ff6b6b; }
</style>
</head>
<body>
<!-- App-level suite for the cross-stitch module (wave K, xs-audit).
     The real app (index.html) loads in a 375 × 812 frame on a private store key and the
     cross-stitch screen is driven through window.XStitchApp.__test and the real DOM, on
     synthetic charts built in code below (nothing from tmp-pdf/).
       bash tools/headless-suite.sh xstitch-app.test
     Everything it makes is deleted and the private key removed at the end. -->
<div id="log"><h1>Cross-stitch app suite</h1><div id="out"></div><div id="summary">running…</div></div>
<script>
'use strict';
var out = document.getElementById('out'), passed = 0, failed = 0;
function log(ok, label, detail) {
  if (ok) passed++; else failed++;
  var d = document.createElement('div');
  d.className = ok ? 'pass' : 'fail';
  d.textContent = (ok ? 'PASS' : 'FAIL') + ' - ' + label + (detail ? '  (' + detail + ')' : '');
  out.appendChild(d);
  (ok ? console.log : console.error)(d.textContent);
}
function note(t) { var d = document.createElement('div'); d.className = 'note'; d.textContent = '     ' + t; out.appendChild(d); }
function group(t) { var d = document.createElement('div'); d.className = 'group'; d.textContent = t; out.appendChild(d); }
function J(v) { try { return JSON.stringify(v); } catch (e) { return String(v); } }
function assertEqual(a, e, label) { var ok = J(a) === J(e); log(ok, label, ok ? '' : 'expected ' + J(e) + ' got ' + J(a)); }
function assertTrue(c, label, detail) { log(!!c, label, c ? '' : (detail === undefined ? 'was false' : String(detail))); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function until(f, ms) {
  var t0 = Date.now();
  return new Promise(function (res) {
    (function tick() { var v = false; try { v = f(); } catch (e) { v = false; } if (v || Date.now() - t0 > (ms || 2000)) res(v); else setTimeout(tick, 20); })();
  });
}
function txt(n) { return n ? n.textContent.replace(/\s+/g, ' ').trim() : ''; }
var finished = false;
function finish() {
  if (finished) return;
  finished = true;
  var s = document.getElementById('summary');
  s.textContent = passed + ' passed, ' + failed + ' failed';
  s.className = failed ? 'bad' : 'ok';
}

var KEY = 'stitchkeeper-wavek-xsaudit-test';
var NAME = /^XSA /;
var frame = document.createElement('iframe');
frame.style.cssText = 'position:fixed;left:-2000px;top:0;width:375px;height:812px;border:0;';
var t0 = Date.now();
var hard = setTimeout(function () { log(false, 'the suite finished in time (90 s)'); cleanup(); finish(); }, 90000);

function cleanup() {
  try {
    var w = frame.contentWindow;
    if (w && w.Store && w.Store.projects) {
      w.Store.projects().slice().forEach(function (p) {
        if (!NAME.test(p.name)) return;
        try { if (w.BlobStore && w.BlobStore.deletePrefix) w.BlobStore.deletePrefix('p:' + p.id + ':'); } catch (e) { /* ignore */ }
        w.Store.deleteProject(p.id);
      });
      try { w.Store.setSetting('focusProjects', {}); } catch (e) { /* ignore */ }
    }
  } catch (e) { /* ignore */ }
  try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
}

frame.onload = function () {
  var w = frame.contentWindow;
  (function wait() {
    if (!(w.App && w.Store && w.XStitchApp && w.XStitch && w.document.getElementById('screen-home'))) {
      if (Date.now() - t0 < 30000) return setTimeout(wait, 100);
      log(false, 'the app frame booted with XStitchApp');
      clearTimeout(hard); cleanup(); finish();
      return;
    }
    run(w).then(function () { clearTimeout(hard); cleanup(); finish(); },
      function (e) { clearTimeout(hard); log(false, 'the suite threw', String(e && (e.stack || e.message) || e)); cleanup(); finish(); });
  })();
};
frame.src = '../index.html';
document.body.appendChild(frame);

/* ------------------------------------------------------------------ *
 * Synthetic charts
 * ------------------------------------------------------------------ */
var PAL = [
  { brand: 'DMC', code: '310', name: 'Black', hex: '000000' },
  { brand: 'DMC', code: '321', name: 'Red', hex: 'c72b3b' },
  { brand: 'DMC', code: '702', name: 'Kelly Green', hex: '47a73b' },
  { brand: 'DMC', code: '3865', name: 'Winter White', hex: 'f9f7f1' },
  { brand: 'DMC', code: '797', name: 'Royal Blue', hex: '13477d' },
  { brand: 'DMC', code: '444', name: 'Lemon', hex: 'ffd600' },
  { brand: 'DMC', code: '208', name: 'Lavender', hex: '835b8b' },
  { brand: 'DMC', code: '931', name: 'Antique Blue', hex: '6a859c' },
  { brand: 'DMC', code: '3371', name: 'Black Brown', hex: '1e1108' },
  { brand: 'DMC', code: '725', name: 'Topaz', hex: 'ffc840' }
];
function cellsOf(w, h, ncol, gap) {
  var c = [];
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var v = ((x >> 2) + (y >> 2)) % ncol;
    if (gap && (x % 7 === 6) && (y % 5 === 4)) v = -1;          // a few fabric squares
    c.push(v);
  }
  return c;
}
function countsOf(cells, n) { var k = []; for (var i = 0; i < n; i++) k.push(0); cells.forEach(function (v) { if (v >= 0) k[v]++; }); return k; }
function rawChart(X, w, h, ncol, o) {
  o = o || {};
  var cells = o.cells || cellsOf(w, h, ncol, true);
  var k = countsOf(cells, ncol);
  var pal = PAL.slice(0, ncol).map(function (e, i) {
    var q = { brand: e.brand, code: e.code, name: e.name, hex: e.hex, kind: 'cross', stitchCount: k[i], keyCount: k[i] };
    return q;
  });
  if (o.palette) pal = o.palette;
  return {
    v: 1,
    fabric: { count: 14, over: 1, kind: 'aida', color: 'White' },
    design: { w: w, h: h, title: o.title || 'Sampler' },
    palette: pal,
    chart: { w: w, h: h, cells: X.packCells(cells, w, h), part: o.part || [], back: o.back || [], knots: o.knots || [] },
    progress: { mode: 'cells' },
    pages: o.pages || [],
    source: o.source || { kind: 'oxs', fileName: 'sampler.oxs' }
  };
}

/* ------------------------------------------------------------------ */
async function run(w) {
  var d = w.document, Store = w.Store, App = w.App, X = w.XStitch, XA = w.XStitchApp, T = XA.__test;
  Store.__setKeyForTests(KEY);
  App.closeAllSheets();
  try { Store.setSetting('focusProjects', {}); } catch (e) { /* ignore */ }
  var scr = d.getElementById('screen-craft');
  function sheets() { return Array.prototype.slice.call(d.querySelectorAll('dialog.sheet')); }
  function topSheet() { var s = sheets(); return s.length ? s[s.length - 1] : null; }
  function sheetBtn(re, root) {
    root = root || topSheet();
    if (!root) return null;
    return Array.prototype.slice.call(root.querySelectorAll('button')).filter(function (b) { return re.test(txt(b)); })[0] || null;
  }
  function key(k, target) {
    var e = new w.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true });
    (target || d.body).dispatchEvent(e);
  }
  function make(name, raw) {
    var p = Store.createProject({ name: 'XSA ' + name, craft: 'crossstitch', craftData: raw });
    return Store.project(p.id);
  }
  function open(p) { App.closeAllSheets(); Store.setActiveProject(p.id); App.render(); }
  function data(p) { return XA.dataOf(Store.project(p.id || p)); }
  function doneCount(p) {
    var dd = data(p), bits = X.bitsState(dd.progress.done, dd.chart.w * dd.chart.h), n = 0;
    for (var i = 0; i < dd.chart.w * dd.chart.h; i++) if (X.getBit(bits, i)) n++;
    return n;
  }
  /* spies on the shell-data recording calls */
  var spy = { counted: [], marks: [] };
  var realCounted = Store.counted, realLog = Store.logMarks;
  Store.counted = function (ev) { spy.counted.push(ev); return realCounted.apply(Store, arguments); };
  Store.logMarks = function (id, list) { spy.marks.push({ id: id, list: list.slice() }); return realLog.apply(Store, arguments); };
  function resetSpy() { spy.counted = []; spy.marks = []; }

  /* ================================================================ */
  group('1. XStitchApp.__test.selfCheck (19 pure checks of the wave K logic)');
  var sc = T.selfCheck();
  assertEqual(sc.length, 19, 'selfCheck returns 19 checks');
  sc.forEach(function (c) { log(c.ok, 'selfCheck: ' + c.name, c.ok ? '' : J(c.got)); });

  /* ================================================================ */
  group('2. The screen and marking (Store.counted + Store.logMarks on every mark and unmark)');
  var p = make('marking', rawChart(X, 30, 20, 4));
  open(p);
  await sleep(80);
  assertTrue(!scr.hidden, 'a cross-stitch project paints #screen-craft');
  var btn = d.getElementById('xs-stitch-btn');
  assertTrue(!!btn, 'the big tap button is there');
  var head = btn.querySelector('.stitch-head');
  assertTrue(!!head && head.contains(btn.querySelector('.stitch-number')), 'the count sits in the pinned .stitch-head row');
  var hcs = head ? w.getComputedStyle(head) : null;
  assertTrue(!!hcs && hcs.position !== 'static' && parseInt(hcs.zIndex, 10) >= 1, 'the count row stacks above the chart canvases (z-index ≥ 1, positioned)', hcs && hcs.position + ' ' + hcs.zIndex);
  var v = T.view();
  assertTrue(v && v.projectId === p.id && v.cells && v.cells.length === 600, 'the view model holds the decoded chart');
  var st0 = T.statsOf(data(p));
  var bar = scr.querySelector('.xs-cb ~ .stitch-section .progress, .stitch-section .progress');
  assertEqual(bar && bar.getAttribute('role'), 'progressbar', 'the total bar is a progressbar');
  assertEqual(bar && bar.getAttribute('aria-valuemax'), String(st0.total), 'its max is the one total');
  assertTrue(/0 of [\d,]+ stitches · 0%/.test(txt(scr.querySelector('.bar-label'))), 'bar label "0 of N stitches · 0%"', txt(scr.querySelector('.bar-label')));
  resetSpy();
  btn.dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 0 }));   // keyboard activation
  await sleep(20);
  assertEqual(doneCount(p), 1, 'Enter / Space on the button (click, detail 0) marks one stitch');
  assertEqual(spy.counted.length, 1, 'Store.counted is called once for that mark');
  assertTrue(spy.counted[0] && spy.counted[0].n === 1 && spy.counted[0].unit === 'stitch' && spy.counted[0].projectId === p.id, 'counted({ n: 1, unit: stitch, projectId })', J(spy.counted[0]));
  assertTrue(spy.counted[0] && spy.counted[0].part === 'DMC 310', 'counted carries the colour as part ("DMC 310")', spy.counted[0] && spy.counted[0].part);
  assertTrue(spy.marks.length === 1 && spy.marks[0].list.length === 1 && spy.marks[0].list[0][1] === 1, 'Store.logMarks gets [[cell, 1]]', J(spy.marks));
  var firstCell = spy.marks[0] && spy.marks[0].list[0][0];
  assertEqual(T.view().cells[firstCell], 0, 'the marked square is the current colour (DMC 310)');
  /* a pointer tap */
  resetSpy();
  var r = btn.getBoundingClientRect();
  var pe = { bubbles: true, cancelable: true, pointerId: 7, pointerType: 'touch', clientX: r.left + 40, clientY: r.top + 40, button: 0 };
  btn.dispatchEvent(new w.PointerEvent('pointerdown', pe));
  btn.dispatchEvent(new w.PointerEvent('pointerup', pe));
  await sleep(20);
  assertEqual(doneCount(p), 2, 'a pointer tap marks a second stitch');
  /* a swipe is not a stitch */
  btn.dispatchEvent(new w.PointerEvent('pointerdown', pe));
  btn.dispatchEvent(new w.PointerEvent('pointermove', Object.assign({}, pe, { clientX: pe.clientX + 40 })));
  btn.dispatchEvent(new w.PointerEvent('pointerup', Object.assign({}, pe, { clientX: pe.clientX + 40 })));
  await sleep(20);
  assertEqual(doneCount(p), 2, 'a swipe on the button counts nothing');
  assertEqual(txt(scr.querySelector('#xs-stitch-btn .stitch-number')), '2', 'the button reads 2');
  /* −1 */
  resetSpy();
  var minus = Array.prototype.slice.call(scr.querySelectorAll('.xs-tap-actions button')).filter(function (b) { return txt(b) === '−1'; })[0];
  minus.click();
  await sleep(20);
  assertEqual(doneCount(p), 1, '−1 unmarks the last stitch');
  assertTrue(spy.counted.length === 1 && spy.counted[0].n === -1, 'Store.counted({ n: -1 }) on the unmark', J(spy.counted));
  assertTrue(spy.marks.length === 1 && spy.marks[0].list[0][1] === 0, 'Store.logMarks gets [[cell, 0]] on the unmark', J(spy.marks));
  /* a list of squares (the drag / 10×10 / page path) */
  resetSpy();
  var list = [];
  for (var i = 0; i < 600 && list.length < 6; i++) if (T.view().cells[i] === 1) list.push(i);
  var mk = T.markCellList(p.id, list, true, 1, null);
  assertEqual(mk, 6, 'markCellList marks 6 squares');
  assertTrue(spy.counted.length === 1 && spy.counted[0].n === 6, 'one Store.counted({ n: 6 }) for a bulk mark', J(spy.counted.map(function (c) { return c.n; })));
  assertTrue(spy.marks.length === 1 && spy.marks[0].list.length === 6, 'one Store.logMarks with 6 pairs', spy.marks.length && spy.marks[0].list.length);
  assertEqual(doneCount(p), 7, '7 done in all');
  var undoBtn = Array.prototype.slice.call(scr.querySelectorAll('.bottombar .bar-btn')).filter(function (b) { return /Undo/.test(txt(b)); })[0];
  undoBtn.click();
  await sleep(40);
  assertEqual(doneCount(p), 1, 'Undo in the bottom bar takes the bulk mark back in one step');
  assertEqual(txt(scr.querySelector('#xs-stitch-btn .stitch-number')), '1', '… and the button follows');
  /* a listener (XStitchApp.onMarked, xs-extras' hook) hears marks */
  var heard = [];
  var off = XA.onMarked(function (ev) { heard.push(ev); });
  btn.dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 0 }));
  await sleep(20);
  off();
  assertTrue(heard.length === 1 && heard[0].on === true && heard[0].n === 1 && heard[0].colour === 0, 'onMarked hears { n: 1, on, colour }', J(heard));

  /* ================================================================ */
  group('3. Stitch mode on the working-mode contract');
  var smBtn = scr.querySelector('.xs-stitch-mode-btn');
  assertTrue(!!smBtn, 'a "⤢ Stitch mode" button under the strip');
  var menuNames = App.ctx && App.ctx.workMode ? 'ok' : 'no ctx.workMode';
  assertEqual(menuNames, 'ok', 'the shell gives ctx.workMode');
  smBtn.click();
  await sleep(120);
  assertTrue(scr.classList.contains('work-mode'), 'Stitch mode opens on #screen-craft');
  assertTrue(Store.focusMode(p.id) === true, 'it is remembered per project (settings.focusProjects)');
  var surf = scr.querySelector('.work-surface .xs-work-chart');
  assertTrue(!!surf, 'the chart is the working surface');
  var sr = surf ? surf.getBoundingClientRect() : { height: 0, width: 0 };
  var share = sr.height * sr.width / (375 * 812);
  note('Stitch mode chart: ' + Math.round(sr.width) + ' × ' + Math.round(sr.height) + ' px = ' + Math.round(share * 100) + '% of a 375 × 812 screen' +
    (scr.classList.contains('work-under-hud') ? ' (surface under the HUD)' : ''));
  assertTrue(share >= 0.70, 'the chart takes at least 70% of the phone screen', Math.round(share * 100) + '%');
  var smApi = App.ctx.workMode;
  if (scr.classList.contains('work-under-hud')) {
    assertTrue(share >= 0.85, 'under the HUD the chart reaches the 85% target', Math.round(share * 100) + '%');
    var free = scr.querySelector('.work-hud') ? (function () {
      var stk = scr.querySelector('.work-stack').getBoundingClientRect(), bt = scr.querySelector('.work-btns').getBoundingClientRect();
      return Math.max(0, bt.top - stk.bottom) * 375 / (375 * 812);
    })() : 0;
    note('free rectangle between the readout and the buttons (where Fit puts the chart): ≈ ' + Math.round(free * 100) + '% of the screen');
    assertTrue(scr.querySelector('.xs-work-chart').classList.contains('xs-under-hud'), 'the chart wrap knows it is under the HUD');
  }
  var big = scr.querySelector('.work-big');
  assertEqual(txt(big), '2', 'the readout shows this colour’s done count');
  var cells = Array.prototype.slice.call(scr.querySelectorAll('.work-cell, .xs-work-cell'));
  assertTrue(/ALL/.test(txt(scr.querySelector('.work-hud'))), 'the readout has the ALL total cell');
  if (d.activeElement && d.activeElement.blur) d.activeElement.blur();
  resetSpy();
  key(' ');
  await sleep(30);
  assertEqual(doneCount(p), 3, 'Space marks the next stitch');
  key('PageDown');
  await sleep(30);
  assertEqual(doneCount(p), 4, 'the pedal (PageDown) is forward = the next stitch');
  key('ArrowRight');
  await sleep(30);
  assertEqual(doneCount(p), 5, 'ArrowRight is forward too');
  key('PageUp');
  await sleep(30);
  assertEqual(doneCount(p), 4, 'PageUp is back = take back the last stitch');
  assertTrue(spy.counted.length === 4 && spy.marks.length === 4, 'every stitch-mode mark and unmark is recorded (4 counted, 4 logMarks)', spy.counted.length + ' / ' + spy.marks.length);
  assertEqual(txt(scr.querySelector('.work-big')), '4', 'the big number follows');
  var wu = scr.querySelector('.work-undo');
  assertTrue(!!wu && !wu.disabled, 'Undo is on the HUD and enabled');
  wu.click();
  await sleep(40);
  assertEqual(doneCount(p), 5, 'HUD Undo takes back the last action (the PageUp unmark)');
  var sec = Array.prototype.slice.call(scr.querySelectorAll('.work-hud button')).map(function (b) { return b.getAttribute('aria-label') || txt(b); });
  assertTrue(sec.some(function (s) { return /Next colour/.test(s); }) && sec.some(function (s) { return /Previous colour/.test(s); }), 'the HUD has ‹ › colour buttons');
  var offRight = Array.prototype.slice.call(scr.querySelectorAll('.work-btns button')).filter(function (b) {
    var rr = b.getBoundingClientRect(); return !b.hidden && (rr.right > 375 || rr.left < 0);
  }).map(function (b) { return (b.getAttribute('aria-label') || txt(b)) + ' ' + Math.round(b.getBoundingClientRect().left) + '–' + Math.round(b.getBoundingClientRect().right); });
  assertTrue(!offRight.length, 'every corner button is on the 375 px screen (+1 was pushed off before)', offRight.join('; '));
  var plusB = scr.querySelector('.work-btns .work-row-plus');
  assertTrue(!!plusB && /\+1/.test(txt(plusB)), 'the +1 button is there');
  var small = Array.prototype.slice.call(scr.querySelectorAll('.work-hud button')).filter(function (b) {
    var rr = b.getBoundingClientRect(); return rr.width > 0 && (rr.width < 44 || rr.height < 44);
  }).map(function (b) { return (b.getAttribute('aria-label') || txt(b)) + ' ' + Math.round(b.getBoundingClientRect().width) + '×' + Math.round(b.getBoundingClientRect().height); });
  assertTrue(!small.length, 'every HUD button is at least 44 × 44 px', small.join('; '));
  /* the next-colour button changes the colour the stitch goes to */
  var nextCol = Array.prototype.slice.call(scr.querySelectorAll('.work-hud button')).filter(function (b) { return /Next colour/.test(b.getAttribute('aria-label') || ''); })[0];
  nextCol.click();
  await sleep(30);
  assertEqual(data(p).current.paletteIndex, 1, '› moves to the next colour');
  key(' ');
  await sleep(30);
  var lastMark = spy.marks[spy.marks.length - 1];
  assertEqual(T.view().cells[lastMark.list[0][0]], 1, 'Space now marks DMC 321');
  /* keys: H highlights */
  key('h');
  await sleep(20);
  assertTrue(T.view().isolate === true, 'H highlights the current colour');
  key('h');
  await sleep(20);
  assertTrue(!T.view().isolate, 'H again shows every colour');
  /* Options panel */
  var more = scr.querySelector('.work-more');
  more.click();
  await sleep(40);
  var panel = scr.querySelector('.work-panel');
  assertTrue(!!panel && !panel.hidden && /Unmark/.test(txt(panel)) && /Find my place/.test(txt(panel)), 'Options ▾ lists the tool, Unmark, Highlight, Find my place');
  assertTrue(!!panel.querySelector('.xs-work-near'), 'Options ▾ has 🎯 Nearest stitch to do');
  assertTrue(/Keep awake|Awake/i.test(txt(panel)), 'the shell adds Keep awake to Options');
  more.click();
  await sleep(20);
  /* remembered: a reload (render from home) reopens it */
  Store.setActiveProject(null); App.render(); await sleep(30);
  assertTrue(!scr.classList.contains('work-mode') || scr.hidden, 'going home leaves Stitch mode');
  open(p); await sleep(150);
  assertTrue(scr.classList.contains('work-mode'), 'opening the project again reopens Stitch mode (remembered)');
  key('Escape');
  await sleep(60);
  assertTrue(!scr.classList.contains('work-mode'), 'Escape closes Stitch mode');
  assertTrue(Store.focusMode(p.id) === false, '… and forgets it');
  /* the readout helper */
  var ro = T.stitchModeReadout(Store.project(p.id));
  assertTrue(ro && ro.cells && ro.cells.length === 2 && /of/.test(ro.say), 'stitchModeReadout gives two cells and a sentence', J(ro && ro.say));

  /* ================================================================ */
  group('4. The check before "Use it" (exact, close, off demoted, unchecked)');
  var realExtract = X.extractGrid;
  function gridRes(kind) {
    var w0 = 12, h0 = 10, cl = cellsOf(w0, h0, 3, false), k = countsOf(cl, 3);
    var printed = k.slice();
    if (kind === 'close') printed[0] += 1;
    if (kind === 'off') printed[0] += 40;
    var entries = PAL.slice(0, 3).map(function (e, i) { return { brand: e.brand, code: e.code, name: e.name, hex: e.hex, kind: 'cross', stitchCount: kind === 'unchecked' ? null : printed[i] }; });
    var dd = X.normalize(rawChart(X, w0, h0, 3, { cells: cl }), null);
    var chk = X.checkCounts(dd, entries);
    return { ok: true, w: w0, h: h0, cells: cl, filled: 120, matched: 3, colors: 3, warnings: [],
      palette: entries.map(function (e, i) { return Object.assign({}, e, { stitchCount: k[i] }); }), check: chk };
  }
  var verdicts = {};
  for (var kind of ['exact', 'close', 'off', 'unchecked']) {
    var res = gridRes(kind);
    verdicts[kind] = res.check && res.check.verdict;
    X.extractGrid = function () { return Promise.resolve(res); };
    var box = d.createElement('div');
    d.body.appendChild(box);
    var used = 0;
    await T.runGridBeta({ doc: {} }, { entries: [] }, box, function () { used++; });
    var useBtn = Array.prototype.slice.call(box.querySelectorAll('button')).filter(function (b) { return /^Use it/.test(txt(b)); })[0];
    var line = box.querySelector('.check-line');
    assertTrue(!!line, kind + ': the check line is shown before Use it', txt(box).slice(0, 120));
    var headP = box.querySelector('.xs-beta-ok');
    assertTrue(/grid in 3 colours\.$/.test(txt(headP)), kind + ': the head says the size and the key colours, no second "N of M matched" count', txt(headP));
    if (kind === 'off') {
      assertEqual(txt(useBtn), 'Use it anyway…', 'off: the button says "Use it anyway…"');
      assertTrue(!useBtn.classList.contains('primary'), 'off: it is demoted (not primary)');
