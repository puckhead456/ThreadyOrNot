<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sewing.js tests</title>
<style>
  body { font: 14px/1.4 Menlo, Consolas, monospace; background:#111; color:#eee; padding:16px; }
  .pass { color:#7bd389; }
  .fail { color:#ff6b6b; background:#2a1414; }
  .group { margin-top:18px; font-weight:bold; color:#9cf; border-bottom:1px solid #333; padding-bottom:4px; }
  #summary { margin-top:20px; font-size:18px; font-weight:bold; }
  #summary.ok { color:#7bd389; }
  #summary.bad { color:#ff6b6b; }
  pre { white-space:pre-wrap; }
</style>
</head>
<body>
<h1>Sewing.js test suite</h1>
<p class="pass">Synthetic snippets only. Nothing here is copied from a real pattern.</p>
<div id="out"></div>
<div id="summary"></div>

<script src="../js/sewing.js"></script>
<script>
'use strict';

var out = document.getElementById('out');
var passed = 0;
var failed = 0;

function log(ok, label, detail) {
  if (ok) { passed++; } else { failed++; }
  var line = (ok ? 'PASS' : 'FAIL') + ' - ' + label + (detail ? '  (' + detail + ')' : '');
  var div = document.createElement('div');
  div.className = ok ? 'pass' : 'fail';
  div.textContent = line;
  out.appendChild(div);
  if (ok) { console.log(line); } else { console.error(line); }
}

function group(title) {
  var div = document.createElement('div');
  div.className = 'group';
  div.textContent = title;
  out.appendChild(div);
  console.log('== ' + title + ' ==');
}

function deepEqual(a, b) {
  if (a === b) return true;
  if (a === null || b === null) return a === b;
  if (typeof a !== typeof b) return false;
  if (typeof a !== 'object') return a === b;
  var ak = Object.keys(a), bk = Object.keys(b);
  if (ak.length !== bk.length) return false;
  for (var i = 0; i < ak.length; i++) {
    var k = ak[i];
    if (!deepEqual(a[k], b[k])) return false;
  }
  return true;
}

function assertEqual(actual, expected, label) {
  var ok = deepEqual(actual, expected);
  log(ok, label, ok ? '' : ('expected ' + JSON.stringify(expected) + ' got ' + JSON.stringify(actual)));
}

function assertTrue(cond, label) { log(!!cond, label, cond ? '' : 'expected truthy'); }
function assertFalse(cond, label) { log(!cond, label, !cond ? '' : 'expected falsy'); }

/** Compare only the listed keys of an object. */
function assertSubset(actual, expected, label) {
  var sub = {};
  Object.keys(expected).forEach(function (k) { sub[k] = actual ? actual[k] : undefined; });
  assertEqual(sub, expected, label);
}

function hasWarning(list, fragment) {
  if (!list) return false;
  for (var i = 0; i < list.length; i++) {
    if (String(list[i]).toLowerCase().indexOf(String(fragment).toLowerCase()) >= 0) return true;
  }
  return false;
}

function pieceNamed(rows, name) {
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i].piece).toLowerCase() === String(name).toLowerCase()) return rows[i];
  }
  return null;
}

function notionMatching(rows, fragment) {
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i].text).toLowerCase().indexOf(String(fragment).toLowerCase()) >= 0) return rows[i];
  }
  return null;
}

var S = window.Sewing;

// =======================================================================
group('Module shape');
// =======================================================================

assertTrue(!!S, 'window.Sewing exists');
['parse', 'normalizeText', 'parseSteps', 'parseCutting', 'parseNotions', 'parseSeamAllowance',
 'parseSizes', 'toCraftData', 'normalize', 'summary', 'templates'].forEach(function (fn) {
  assertTrue(typeof S[fn] === 'function', 'Sewing.' + fn + ' is a function');
});
assertTrue(Object.prototype.toString.call(S.TEMPLATES) === '[object Array]', 'Sewing.TEMPLATES is an array');

// =======================================================================
group('normalizeText - glyphs');
// =======================================================================

assertEqual(S.normalizeText('“Wren”'), '"Wren"', 'curly double quotes become straight');
assertEqual(S.normalizeText('don’t'), "don't", 'curly apostrophe becomes straight');
assertEqual(S.normalizeText('sew at 1/2″'), 'sew at 1/2"', 'double prime becomes an inch mark');
assertEqual(S.normalizeText("1/2'' seam"), '1/2" seam', 'two apostrophes become one inch mark');
assertEqual(S.normalizeText('1/2’’ seam'), '1/2" seam', 'two curly apostrophes become one inch mark');
assertEqual(S.normalizeText('5′ tall'), "5' tall", 'prime becomes a foot mark');
assertEqual(S.normalizeText('a b'), 'a b', 'non-breaking space becomes a plain space');
assertEqual(S.normalizeText('a​b'), 'ab', 'zero-width space is dropped');
assertEqual(S.normalizeText('sew   the   seam'), 'sew the seam', 'runs of spaces collapse');
assertEqual(S.normalizeText('  padded  \n  line  '), 'padded\nline', 'lines are trimmed');
assertEqual(S.normalizeText('a\r\nb'), 'a\nb', 'CRLF becomes LF');
assertEqual(S.normalizeText(''), '', 'empty string stays empty');
assertEqual(S.normalizeText(null), '', 'null is tolerated');
assertEqual(S.normalizeText(undefined), '', 'undefined is tolerated');
assertEqual(S.normalizeText(42), '', 'a number is tolerated');

// =======================================================================
group('normalizeText - fractions');
// =======================================================================

assertEqual(S.normalizeText('4½"'), '4 1/2"', 'fraction glued to a digit gains a space');
assertEqual(S.normalizeText('½"'), '1/2"', 'standalone half');
assertEqual(S.normalizeText('¼'), '1/4', 'quarter');
assertEqual(S.normalizeText('¾'), '3/4', 'three quarters');
assertEqual(S.normalizeText('⅛ ⅜ ⅝ ⅞'), '1/8 3/8 5/8 7/8', 'eighths');
assertEqual(S.normalizeText('⅓ ⅔'), '1/3 2/3', 'thirds');
assertEqual(S.normalizeText('2-1/2 yards'), '2 1/2 yards', 'hyphenated mixed number splits');
assertEqual(S.normalizeText('2–1/2 yards'), '2 1/2 yards', 'en-dashed mixed number splits');
assertEqual(S.normalizeText('Cut 2 - 14" x 16"'), 'Cut 2 - 14" x 16"', 'a plain hyphen between whole numbers is left alone');
assertEqual(S.normalizeText('seam allowance is ⅝"'), 'seam allowance is 5/8"', 'five eighths in a sentence');
assertEqual(S.normalizeText(S.normalizeText('4½" x WOF')), '4 1/2" x WOF', 'normalizeText is idempotent');

// =======================================================================
group('normalizeText - dot leaders and dashes');
// =======================================================================

assertEqual(S.normalizeText('Front Bodice . . . . . Cut 2'), 'Front Bodice — Cut 2', 'spaced dot leaders collapse');
assertEqual(S.normalizeText('Front........Cut 2'), 'Front — Cut 2', 'solid dot leaders collapse');
assertEqual(S.normalizeText('Front……Cut 2'), 'Front — Cut 2', 'ellipsis leaders collapse');
assertEqual(S.normalizeText('Front····Cut 2'), 'Front — Cut 2', 'middot leaders collapse');
assertEqual(S.normalizeText('Front---Cut 2'), 'Front — Cut 2', 'hyphen leaders collapse');
assertEqual(S.normalizeText('Front — Cut 2'), 'Front - Cut 2', 'a lone em dash becomes a hyphen (leaders keep the em dash)');
assertEqual(S.normalizeText('Front .... Cut 2').indexOf('—') > 0, true, 'a collapsed leader is an em dash');
assertEqual(S.normalizeText('sizes 6–20'), 'sizes 6-20', 'a lone en dash becomes a hyphen');
assertEqual(S.normalizeText('=== PAGE 6 ==='), '=== PAGE 6 ===', 'page markers are untouched');
assertEqual(S.normalizeText('a\n=== PAGE 12 ===\nb'), 'a\n=== PAGE 12 ===\nb', 'page markers survive inside a document');

// =======================================================================
group('Headings');
// =======================================================================

assertTrue(S.isHeading('CONSTRUCTION'), 'ALL CAPS heading');
assertTrue(S.isHeading('Attaching the Collar'), 'Title Case heading');
assertTrue(S.isHeading('3. THE SLEEVES'), 'numbered ALL CAPS heading');
assertTrue(S.isHeading('NOTIONS:'), 'a trailing colon is allowed');
assertFalse(S.isHeading('Press the seam allowances open.'), 'a sentence is not a heading');
assertFalse(S.isHeading('With right sides together, pin the front to the back at the shoulders'), 'a long line is not a heading');
assertFalse(S.isHeading('sew the shoulder seams'), 'lowercase prose is not a heading');
assertFalse(S.isHeading(''), 'empty string is not a heading');
assertFalse(S.isHeading('Cut the front,'), 'a trailing comma rules out a heading');

assertEqual(S.headingText('3. THE SLEEVES'), 'THE SLEEVES', 'headingText strips the number');
assertEqual(S.headingText('NOTIONS:'), 'NOTIONS', 'headingText strips the colon');

assertEqual(S.headingKind('CUTTING'), 'cut', 'CUTTING is a cutting heading');
assertEqual(S.headingKind('CUTTING INSTRUCTIONS'), 'cut', 'CUTTING INSTRUCTIONS is a cutting heading');
assertEqual(S.headingKind('Cutting List'), 'cut', 'Cutting List is a cutting heading');
assertEqual(S.headingKind('PATTERN PIECES'), 'cut', 'PATTERN PIECES is a cutting heading');
assertEqual(S.headingKind('From Fabric A'), 'cut', 'From Fabric A is a cutting heading');
assertEqual(S.headingKind('NOTIONS'), 'notions', 'NOTIONS');
assertEqual(S.headingKind('YOU WILL NEED'), 'notions', 'YOU WILL NEED');
assertEqual(S.headingKind('HABERDASHERY'), 'notions', 'HABERDASHERY');
assertEqual(S.headingKind('HARDWARE'), 'notions', 'HARDWARE');
assertEqual(S.headingKind('MATERIALS'), 'notions', 'MATERIALS');
assertEqual(S.headingKind('FABRIC REQUIREMENTS'), 'fabric', 'FABRIC REQUIREMENTS');
assertEqual(S.headingKind('YARDAGE'), 'fabric', 'YARDAGE');
assertEqual(S.headingKind('SIZE CHART'), 'size', 'SIZE CHART');
assertEqual(S.headingKind('FINISHED GARMENT MEASUREMENTS'), 'size', 'FINISHED GARMENT MEASUREMENTS');
assertEqual(S.headingKind('CONSTRUCTION'), 'steps', 'CONSTRUCTION');
assertEqual(S.headingKind('QUILT TOP ASSEMBLY'), 'steps', 'QUILT TOP ASSEMBLY');
assertEqual(S.headingKind('VIEW A'), 'steps', 'VIEW A');
assertEqual(S.headingKind('FINISHING'), 'steps', 'FINISHING');
assertEqual(S.headingKind('Buttercup'), null, 'an unknown heading has no kind');

// =======================================================================
group('Step markers');
// =======================================================================

assertSubset(S.stepMarker('1. Sew the shoulder seams'), { n: 1, marker: '1.' }, "'1.' style");
assertSubset(S.stepMarker('12) Press the seam open'), { n: 12, marker: '1)' }, "'1)' style");
assertSubset(S.stepMarker('01: Staystitch the neckline'), { n: 1, marker: '1.' }, "'01:' style");
assertSubset(S.stepMarker('Step 1 - Cut your fabric'), { n: 1, marker: 'Step' }, "'Step 1 - ' style");
assertSubset(S.stepMarker('Step 7 Attach the collar'), { n: 7, marker: 'Step' }, "'Step 7 ' style");
assertSubset(S.stepMarker('STEP 12'), { n: 12, marker: 'Step', rest: '' }, 'a bare Step heading has empty rest');
assertSubset(S.stepMarker('- 4. Turn the bag right side out'), { n: 4, marker: '1.' }, 'a bullet before the number is stripped');
assertEqual(S.stepMarker('1. Sew the shoulder seams').rest, 'Sew the shoulder seams', 'rest excludes the marker');

assertEqual(S.stepMarker('1.5 cm from the edge'), null, 'a decimal measurement is not a step');
assertEqual(S.stepMarker('2. 5 mm from the edge'), null, 'a spaced measurement is not a step');
assertEqual(S.stepMarker('1. cm'), null, 'a bare unit is not a step');
assertEqual(S.stepMarker('3. 1/2" seam allowance'), null, 'a fraction remainder is not a step');
assertEqual(S.stepMarker('Sew the shoulder seams'), null, 'an unnumbered line is not a step');
assertEqual(S.stepMarker(''), null, 'empty line is not a step');
assertEqual(S.stepMarker('Fig. 1'), null, 'a figure reference is not a step');
assertTrue(S.stepMarker('5. (Optional) Topstitch the hem') !== null, 'a step may open with a parenthesis');

// =======================================================================
group('parseSteps - a plain numbered booklet');
// =======================================================================

var simpleSteps = S.parseSteps(
  'CONSTRUCTION\n' +
  '1. With RST, pin the front to the back at the shoulder seams and stitch.\n' +
  '2. Press the shoulder seams towards the back.\n' +
  '3. Staystitch the neckline 1 cm from the raw edge.\n'
);
assertEqual(simpleSteps.length, 3, 'three steps parsed');
assertEqual(simpleSteps[0].n, 1, 'first step is number 1');
assertEqual(simpleSteps[0].section, 'Construction', 'ALL CAPS section is prettified');
assertEqual(simpleSteps[0].marker, '1.', 'marker style recorded');
assertEqual(simpleSteps[2].text, 'Staystitch the neckline 1 cm from the raw edge.', 'third step text');
assertEqual(simpleSteps[0].page, null, 'no page markers means page is null');
assertEqual(simpleSteps.warnings.length, 0, 'a clean booklet produces no step warnings');

var wrapped = S.parseSteps(
  '1. With right sides together, pin the front\n' +
  'to the back at the shoulder seams and\n' +
  'stitch at 1.5 cm.\n' +
  '\n' +
  '2. Press.\n'
);
assertEqual(wrapped.length, 2, 'wrapped lines do not create extra steps');
assertEqual(wrapped[0].text,
  'With right sides together, pin the front to the back at the shoulder seams and stitch at 1.5 cm.',
  'wrapped lines merge into one step');
assertEqual(wrapped[1].text, 'Press.', 'the step after a blank line is separate');

var pageSteps = S.parseSteps(
  '=== PAGE 6 ===\n' +
  '1. Sew the side seams.\n' +
  '=== PAGE 7 ===\n' +
  '2. Hem the sleeves.\n'
);
assertEqual(pageSteps.length, 2, 'page markers do not become steps');
assertEqual(pageSteps[0].page, 6, 'step 1 is on page 6');
assertEqual(pageSteps[1].page, 7, 'step 2 is on page 7');

var stepStyle = S.parseSteps('Step 1 Cut the pieces.\nStep 2 Sew the seams.\nStep 3 Press.');
assertEqual(stepStyle.length, 3, 'Step N style parses');
assertEqual(stepStyle[0].marker, 'Step', 'Step N marker style recorded');

var parenStyle = S.parseSteps('1) Cut.\n2) Sew.\n3) Press.');
assertEqual(parenStyle.length, 3, '1) style parses');
assertEqual(parenStyle[0].marker, '1)', '1) marker style recorded');

// =======================================================================
group('parseSteps - sections, restarts and rejections');
// =======================================================================

var restart = S.parseSteps(
  'BODICE\n' +
  '1. Sew the darts.\n' +
  '2. Join the shoulders.\n' +
  'SLEEVES\n' +
  '1. Gather the sleeve head.\n' +
  '2. Set the sleeve into the armhole.\n'
);
assertEqual(restart.length, 4, 'a restart at 1 keeps all four steps');
assertEqual(restart[0].section, 'Bodice', 'first section name');
assertEqual(restart[2].section, 'Sleeves', 'second section name');
assertEqual(restart[2].n, 1, 'numbering restarts inside the new section');

var restartNoHeading = S.parseSteps('1. Sew.\n2. Press.\n1. Cut.\n2. Fuse.');
assertEqual(restartNoHeading.length, 4, 'a restart with no heading still keeps every step');
assertTrue(restartNoHeading[2].section !== restartNoHeading[0].section, 'a nameless restart opens a new section');

var views = S.parseSteps(
  'VIEW A\n1. Sew the patch pocket on.\n2. Hem.\n' +
  'VIEW B\n1. Sew the welt pocket.\n2. Hem.\n'
);
assertEqual(views.length, 4, 'both views parse');
assertEqual(views[0].section, 'View A', 'view A section');
assertEqual(views[2].section, 'View B', 'view B section');

var figureJump = S.parseSteps('1. Sew.\n2. Press.\n97. Nonsense from a figure caption.\n3. Hem.');
assertEqual(figureJump.length, 3, 'a wild number jump is rejected');
assertEqual(figureJump[2].n, 3, 'the real step 3 still parses');

var measureLines = S.parseSteps('1. Sew.\n1.5 cm is the seam allowance.\n2. Press.');
assertEqual(measureLines.length, 2, 'a measurement line does not become a step');
assertTrue(measureLines[0].text.indexOf('1.5 cm is the seam allowance.') >= 0, 'the measurement line merges into step 1');

var noSteps = S.parseSteps('Sew the front to the back.\nPress everything well.\nEnjoy your garment.');
assertEqual(noSteps.length, 0, 'no numbered steps means no steps');
assertTrue(hasWarning(noSteps.warnings, 'No numbered steps found'), 'a warning explains there were no steps');

var fallback = S.parseSteps(
  'With right sides together, sew the front to the back at the shoulders and press.\n' +
  '\n' +
  'Turn the garment right side out and topstitch the neckline all the way round.\n',
  { fallback: true }
);
assertEqual(fallback.length, 2, 'the opt-in paragraph fallback makes one step per paragraph');
assertEqual(fallback[0].marker, 'none', 'fallback steps are marked "none"');

var longStep = ['1. Press the seam allowance carefully.'];
for (var lw = 0; lw < 60; lw++) longStep.push('Keep pressing the seam allowance carefully all the way along.');
var longParsed = S.parseSteps(longStep.join('\n'));
assertEqual(longParsed.length, 1, 'a very long step is still one step');
assertTrue(longParsed[0].text.length <= 810, 'step text is capped near 800 characters');

var many = [];
for (var mi = 1; mi <= 260; mi++) many.push(mi + '. Do a thing.');
var manyParsed = S.parseSteps(many.join('\n'));
assertEqual(manyParsed.length, 200, 'steps are capped at 200');
assertTrue(hasWarning(manyParsed.warnings, '200'), 'the 200-step cap is warned about');

var interleaved = [];
for (var ii = 0; ii < 10; ii++) { interleaved.push((ii + 1) + '. Left column line.'); interleaved.push((ii + 60) + '. Right column line.'); }
var interParsed = S.parseSteps(interleaved.join('\n'), { columns: 2 });
assertTrue(hasWarning(interParsed.warnings, 'interleaved'), 'heavy non-monotonic markers warn about interleaved columns');
assertTrue(hasWarning(interParsed.warnings, '2 columns'), 'the column count is included when known');
</script>
<script>
'use strict';

// =======================================================================
group('parseCutting - family 1: piece then "cut N"');
// =======================================================================

var cut1 = S.parseCutting([
  'Front Bodice — Cut 2 on the fold, main',
  'Back ............ cut 1 on fold',
  'Sleeve - cut 2 (1 pair)',
  'Neck facing: cut 1 interfacing'
]);
assertEqual(cut1.length, 4, 'four garment pieces parsed');
assertSubset(cut1[0], { piece: 'Front Bodice', qty: 2, material: 'main', onFold: true }, 'Front Bodice, cut 2, on fold, main');
assertSubset(cut1[1], { piece: 'Back', qty: 1, onFold: true }, 'dot leaders resolve to Back, cut 1, on fold');
assertSubset(cut1[2], { piece: 'Sleeve', qty: 2, note: '1 pair' }, 'Sleeve cut 2 keeps the parenthetical note');
assertSubset(cut1[3], { piece: 'Neck facing', qty: 1, material: 'interfacing' }, 'facing is interfacing');
assertFalse(cut1[2].onFold, 'a sleeve is not on the fold');
assertEqual(cut1[0].cutCount, undefined, 'the parser does not invent progress fields');

// =======================================================================
group('parseCutting - family 2: "Cut N ..." dimensional (bags)');
// =======================================================================

var cut2 = S.parseCutting([
  'Cut 2 - 14" x 16" from exterior',
  'Cut (4) 2 1/2" x 38" strap pieces from main',
  'Cut 1 - 16" x 11" lining zipper pocket'
]);
assertEqual(cut2.length, 3, 'three dimensional bag pieces parsed');
assertEqual(cut2[0].qty, 2, 'Cut 2 gives qty 2');
assertEqual(cut2[0].dims, '14" x 16"', 'dims captured from the line');
assertEqual(cut2[0].material, 'main', 'exterior maps to main');
assertEqual(cut2[1].qty, 4, 'a parenthesised count parses');
assertEqual(cut2[2].material, 'lining', 'lining maps to lining');
assertTrue(cut2[1].dims.indexOf('x') > 0, 'the strap line keeps its dimensions');

// =======================================================================
group('parseCutting - family 3: the x forms');
// =======================================================================

var cut3 = S.parseCutting([
  '2 x Front (main)',
  'Pocket bag x4 lining',
  '1 × Base panel - interfacing',
  'Strap × 2'
]);
assertEqual(cut3.length, 4, 'four x-form pieces parsed');
assertSubset(cut3[0], { piece: 'Front', qty: 2, material: 'main' }, '2 x Front (main)');
assertSubset(cut3[1], { piece: 'Pocket bag', qty: 4, material: 'lining' }, 'Pocket bag x4 lining');
assertSubset(cut3[2], { piece: 'Base panel', qty: 1, material: 'interfacing' }, 'unicode multiplication sign works');
assertSubset(cut3[3], { piece: 'Strap', qty: 2 }, 'trailing x 2');

// =======================================================================
group('parseCutting - family 4: quilting WOF strips');
// =======================================================================

var cut4 = S.parseCutting([
  'From Fabric A, cut (7) 4 1/2" x WOF strips.',
  '10 strips 2 1/2" x width of fabric',
  '(3) strips 5" x WOF'
]);
assertEqual(cut4.length, 3, 'three quilting strip rows parsed');
assertEqual(cut4[0].qty, 7, 'a parenthesised strip count parses');
assertEqual(cut4[1].qty, 10, 'a bare strip count parses');
assertEqual(cut4[1].piece, '2 1/2" x WOF strip', 'width-of-fabric spelled out is normalised to a WOF strip name');
assertEqual(cut4[2].qty, 3, 'a leading parenthesised count parses');
assertTrue(cut4[0].piece.indexOf('4 1/2"') >= 0, 'the strip width survives in the piece name');
assertTrue(String(cut4[0].note + cut4[0].material).toLowerCase().indexOf('fabric a') >= 0 ||
  cut4[0].material === 'other', 'the From Fabric A context is carried onto the row');

// =======================================================================
group('parseCutting - family 5: quilting subcut');
// =======================================================================

var cut5 = S.parseCutting([
  'Subcut into (64) 4 1/2" squares.',
  'Sub-cut 24 2 1/2" squares',
  'Subcut into 8 rectangles 2 1/2" x 4 1/2"'
]);
assertEqual(cut5.length, 3, 'three subcut rows parsed');
assertEqual(cut5[0].qty, 64, 'subcut count parses');
assertEqual(cut5[0].piece, '4 1/2" square', 'subcut piece name is singularised');
assertEqual(cut5[1].qty, 24, 'the hyphenated Sub-cut spelling parses');
assertEqual(cut5[2].qty, 8, 'subcut without parentheses parses');

// =======================================================================
group('parseCutting - flags, dedup and rejections');
// =======================================================================

var flags = S.parseCutting([
  'Collar stand — cut 1 on the bias from contrast',
  'Under collar - cut 1 mirrored, interfacing',
  'Batting — cut 1',
  'Backing — cut 1'
]);
assertEqual(flags[0].grain, 'on the bias', 'bias grain captured');
assertEqual(flags[0].material, 'contrast', 'contrast material captured');
assertEqual(flags[1].grain, 'mirrored', 'mirrored grain captured');
assertEqual(flags[2].material, 'batting', 'batting material captured');
assertEqual(flags[3].material, 'other', 'backing falls into other');

var dupes = S.parseCutting(['Front — cut 2 main', 'Front — cut 2 main', 'Front — cut 1 main']);
assertEqual(dupes.length, 2, 'identical rows are de-duplicated, a different qty is kept');

assertEqual(S.cutRow('Press the seam allowances open.', null), null, 'a plain instruction is not a cutting row');
assertEqual(S.cutRow('', null), null, 'an empty line is not a cutting row');
assertEqual(S.cutRow('With right sides together, cut 2 notches into the curve and then press everything very carefully indeed before you continue', null), null, 'a long sentence is rejected');
assertEqual(S.parseCutting([]).length, 0, 'an empty list gives no rows');

var numbered = S.parseCutting(['1. Front — cut 2', '2. Cut 4 pocket pieces']);
assertEqual(numbered.length, 2, 'a numbered cutting list still parses');
assertEqual(numbered[0].piece, 'Front', 'the list number is not part of the piece name');
assertEqual(numbered[1].qty, 4, 'a numbered "Cut N" row parses');

// =======================================================================
group('parseNotions');
// =======================================================================

var notions = S.parseNotions([
  '1 x 20 cm invisible zip',
  '(2) 5/8" D-rings',
  'two 10" zippers',
  'Matching thread',
  '4 rivets',
  'Fusible interfacing x2',
  '1 - 18 mm magnetic snap'
]);
assertEqual(notions.length, 7, 'seven notions parsed');
assertEqual(notions[0].qty, 1, '"1 x ..." gives qty 1');
assertEqual(notions[0].text, '1 x 20 cm invisible zip', 'notion text keeps the whole line');
assertEqual(notions[0].kind, 'notion', 'a zip is a plain notion');
assertEqual(notions[1].qty, 2, '"(2)" gives qty 2');
assertEqual(notions[1].kind, 'hardware', 'D-rings are hardware');
assertEqual(notions[2].qty, 2, '"two" gives qty 2');
assertEqual(notions[3].qty, null, 'a notion with no number has a null qty');
assertEqual(notions[4].qty, 4, 'a bare leading number gives qty');
assertEqual(notions[4].kind, 'hardware', 'rivets are hardware');
assertEqual(notions[5].qty, 2, 'a trailing x2 gives qty 2');
assertEqual(notions[5].kind, 'interfacing', 'fusible interfacing is interfacing');
assertEqual(notions[6].qty, 1, '"1 - ..." gives qty 1');
assertEqual(notions[6].kind, 'hardware', 'a magnetic snap is hardware');

assertEqual(S.notionQty('20 cm invisible zip'), null, 'a leading measurement is not a quantity');
assertEqual(S.notionQty('2 m of webbing'), null, 'a leading number followed by a unit is not a quantity');
assertEqual(S.notionKind('Soft and Stable'), 'interfacing', 'branded stabiliser is interfacing');
assertEqual(S.notionKind('Pellon SF-101 Shape Flex'), 'interfacing', 'SF-101 is interfacing');
assertEqual(S.notionKind('Swivel hook'), 'hardware', 'a swivel hook is hardware');
assertEqual(S.notionKind('Bias binding'), 'notion', 'bias binding is a plain notion');

var loose = S.parseNotions([
  'This pattern was drafted for a stable woven.',
  'You will need a 20 cm invisible zip and matching thread.',
  'Thread to match'
], { inBlock: false });
assertTrue(loose.length >= 1, 'outside a block only vocabulary lines are picked up');

assertEqual(pagesSorted.map(function (p) { return p.n; }), [1, 2, 3], 'pages come back in page order');

var pagesJunk = S.normalize({
  pages: [
    null,
    'page 2',
    { n: 4 },                                   // no blob key
    { blobKey: 'p:abc:page:0' },                // no page number
    { n: 0, blobKey: 'p:abc:page:0' },          // page 0 does not exist
    { n: 5, blobKey: 'p:abc:page:5', w: -3, h: 'tall' },
    { n: 5, blobKey: 'p:abc:page:5b', w: 1, h: 1 }   // duplicate page number
  ]
}, null).pages;
assertEqual(pagesJunk.length, 1, 'junk page rows are dropped and duplicates collapse');
assertEqual(pagesJunk[0], { n: 5, blobKey: 'p:abc:page:5', w: 0, h: 0 }, 'bad sizes repair to 0 and the first row wins');

(function () {
  var many = [];
  for (var i = 1; i <= 60; i++) many.push({ n: i, blobKey: 'p:abc:page:' + i, w: 100, h: 100 });
  var capped = S.normalize({ pages: many }, null).pages;
  assertEqual(capped.length, 40, 'no more than 40 pages are ever kept');
  assertEqual(capped[39].n, 40, 'the kept pages are the first 40');
})();

(function () {
  // A re-import with the pages box unticked must leave the images alone.
  var existing = S.normalize({
    pages: [{ n: 6, blobKey: 'p:abc:page:6', w: 1400, h: 1980 }],
    steps: [{ n: 1, text: 'Sew the darts.', done: true, page: 6 }]
  }, null);
  var parsedAgain = S.parse('CONSTRUCTION\n1. Sew the darts.\n2. Press them towards the centre.\n');
  var merged = S.toCraftData(parsedAgain, existing, { groups: { steps: true } });
  assertEqual(merged.pages, existing.pages, 'a re-import keeps the page images that were already there');
  assertEqual(merged.steps.length, 2, 'the re-import still replaced the steps');
  assertTrue(merged.steps[0].done, 'and kept the step that was already done');
})();

(function () {
  var withPages = S.normalize({
    pages: [{ n: 2, blobKey: 'p:abc:page:2', w: 8, h: 9 }]
  }, null);
  var round = S.normalize(JSON.parse(JSON.stringify(withPages)), null);
  assertEqual(round.pages, withPages.pages, 'pages survive a JSON round trip (export/import)');
})();

// =======================================================================
group('Performance');
// =======================================================================

(function () {
  // 40 pages, >= 60 KB - the shape of a long indie instruction booklet.
  var pagesText = [];
  for (var pageNo = 1; pageNo <= 40; pageNo++) {
    pagesText.push('=== PAGE ' + pageNo + ' ===');
    pagesText.push('CONSTRUCTION');
    for (var k = 1; k <= 7; k++) {
      pagesText.push(k + '. With right sides together, pin the front to the back at the shoulder seams and stitch at 1.5 cm, then press the seam allowances towards the back and finish the raw edges.');
      pagesText.push('Trim the seam allowance to 6 mm and understitch the facing, then press it towards the body.');
      pagesText.push('');
    }
    pagesText.push('CUTTING');
    pagesText.push('Front bodice — cut 2 main');
    pagesText.push('Back bodice — cut 1 on the fold, main');
  }
  var big = pagesText.join('\n');
  assertTrue(big.length >= 60000, 'the perf document is at least 60 KB (' + big.length + ' chars)');
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  var res = S.parse(big);
  var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
  var ms = t1 - t0;
  log(true, 'perf: parsed ' + big.length + ' chars over ' + res.pages + ' pages in ' + ms.toFixed(1) + ' ms');
  assertEqual(res.pages, 40, 'the perf document is 40 pages');
  assertTrue(ms < 50, 'a 40-page, 60 KB booklet parses in under 50 ms (' + ms.toFixed(1) + ' ms)');
  assertTrue(res.steps.length > 0, 'the big booklet produced steps');
  window.__sewingPerfMs = ms;
  window.__sewingPerfChars = big.length;
})();

var sum = document.getElementById('summary');
sum.className = failed ? 'bad' : 'ok';
sum.textContent = (failed ? 'FAILED ' : 'ALL PASS ') + passed + ' passed, ' + failed + ' failed';
window.__sewingTestResults = { passed: passed, failed: failed };
console.log(sum.textContent);
