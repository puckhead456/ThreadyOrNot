<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patterns.js tests</title>
<style>
  body { font: 14px/1.4 Menlo, Consolas, monospace; background:#111; color:#eee; padding:16px; }
  .pass { color:#7bd389; }
  .fail { color:#ff6b6b; background:#2a1414; }
  .group { margin-top:18px; font-weight:bold; color:#9cf; border-bottom:1px solid #333; padding-bottom:4px; }
  #summary { margin-top:20px; font-size:18px; font-weight:bold; }
  #summary.ok { color:#7bd389; }
  #summary.bad { color:#ff6b6b; }
  pre { white-space:pre-wrap; }
</style>
</head>
<body>
<h1>Patterns.js test suite</h1>
<div id="out"></div>
<div id="summary"></div>

<script src="../js/patterns.js"></script>
<!-- pdftext.js is loaded for its pure line-rebuilding helpers only; pdf.js
     itself is not needed here (the library loads lazily, on first extract). -->
<script src="../js/pdftext.js"></script>
<script>
'use strict';

var out = document.getElementById('out');
var passed = 0;
var failed = 0;

function log(ok, label, detail) {
  if (ok) { passed++; } else { failed++; }
  var line = (ok ? 'PASS' : 'FAIL') + ' - ' + label + (detail ? '  (' + detail + ')' : '');
  var div = document.createElement('div');
  div.className = ok ? 'pass' : 'fail';
  div.textContent = line;
  out.appendChild(div);
  if (ok) { console.log(line); } else { console.error(line); }
}

function group(title) {
  var div = document.createElement('div');
  div.className = 'group';
  div.textContent = title;
  out.appendChild(div);
  console.log('== ' + title + ' ==');
}

function deepEqual(a, b) {
  if (a === b) return true;
  if (a === null || b === null) return a === b;
  if (typeof a !== typeof b) return false;
  if (typeof a !== 'object') return a === b;
  var ak = Object.keys(a), bk = Object.keys(b);
  if (ak.length !== bk.length) return false;
  for (var i = 0; i < ak.length; i++) {
    var k = ak[i];
    if (!deepEqual(a[k], b[k])) return false;
  }
  return true;
}

function assertEqual(actual, expected, label) {
  var ok = deepEqual(actual, expected);
  log(ok, label, ok ? '' : ('expected ' + JSON.stringify(expected) + ' got ' + JSON.stringify(actual)));
}

function assertTrue(cond, label) {
  log(!!cond, label);
}

// v2: summary() grew extra keys, so most summary assertions check a subset.
function assertSubset(actual, expected, label) {
  var sub = {};
  Object.keys(expected).forEach(function (k) { sub[k] = actual ? actual[k] : undefined; });
  assertEqual(sub, expected, label);
}

// -----------------------------------------------------------------------
group('Amigurumi pattern (rounds, ranges, counts)');
// -----------------------------------------------------------------------

var amiText =
  'Rnd 1: 6 sc in magic ring (6)\n' +
  'Rnd 2: inc around (12)\n' +
  'Rnd 3: (sc 1, inc) x6 (18)\n' +
  'Rnd 4: (sc 2, inc) x6 (24)\n' +
  'Rnd 5: (sc 3, inc) x6 (30)\n' +
  'Rnd 6-10: sc around (30)\n' +
  'Rnd 11: (sc 3, dec) x6 (24)';

var ami = window.Patterns.parse(amiText);

assertEqual(ami.length, 7, 'ami: 7 lines parsed');
assertEqual({ row: ami[0].row, rowEnd: ami[0].rowEnd, stitches: ami[0].stitches }, { row: 1, rowEnd: 1, stitches: 6 }, 'ami line 0: Rnd 1 (6)');
assertEqual({ row: ami[1].row, rowEnd: ami[1].rowEnd, stitches: ami[1].stitches }, { row: 2, rowEnd: 2, stitches: 12 }, 'ami line 1: Rnd 2 (12)');
assertEqual({ row: ami[2].row, rowEnd: ami[2].rowEnd, stitches: ami[2].stitches }, { row: 3, rowEnd: 3, stitches: 18 }, 'ami line 2: Rnd 3, (sc 1, inc) parenthetical ignored, count 18');
assertEqual({ row: ami[4].row, rowEnd: ami[4].rowEnd, stitches: ami[4].stitches }, { row: 5, rowEnd: 5, stitches: 30 }, 'ami line 4: Rnd 5 (30)');
assertEqual({ row: ami[5].row, rowEnd: ami[5].rowEnd, stitches: ami[5].stitches }, { row: 6, rowEnd: 10, stitches: 30 }, 'ami line 5: Rnd 6-10 range (30)');
assertEqual({ row: ami[6].row, rowEnd: ami[6].rowEnd, stitches: ami[6].stitches }, { row: 11, rowEnd: 11, stitches: 24 }, 'ami line 6: Rnd 11, last number in "(sc 3, dec) x6 (24)" is 24');
assertEqual(ami[0].index, 0, 'ami: index is 0-based');
assertEqual(ami[0].text, 'Rnd 1: 6 sc in magic ring (6)', 'ami: original text preserved');

assertEqual(window.Patterns.targetFor(ami, 1), 6, 'ami targetFor(1) == 6');
assertEqual(window.Patterns.targetFor(ami, 8), 30, 'ami targetFor(8) inside 6-10 range == 30');
assertEqual(window.Patterns.targetFor(ami, 10), 30, 'ami targetFor(10) end of range == 30');
assertEqual(window.Patterns.targetFor(ami, 11), 24, 'ami targetFor(11) == 24');
assertEqual(window.Patterns.targetFor(ami, 12), null, 'ami targetFor(12) beyond pattern == null');
assertEqual(window.Patterns.lineFor(ami, 7).text, 'Rnd 6-10: sc around (30)', 'ami lineFor(7) resolves range line');
assertEqual(window.Patterns.lineFor(ami, 12), null, 'ami lineFor(12) == null');

var amiSummary = window.Patterns.summary(ami);
assertSubset(amiSummary, { rows: 11, maxRow: 11, hasTargets: true }, 'ami summary: rows=11 (range counted), maxRow=11, hasTargets=true');

// -----------------------------------------------------------------------
group('Row-based blanket pattern (no stitch counts)');
// -----------------------------------------------------------------------

var blanketText =
  'Row 1: ch 20, sc in 2nd ch from hook and each ch across\n' +
  'Row 2: ch 1, turn, sc in each st across\n' +
  'Row 3: ch 1, turn, sc in each st across';

var blanket = window.Patterns.parse(blanketText);
assertEqual(blanket.map(function (l) { return l.row; }), [1, 2, 3], 'blanket: rows 1,2,3 detected');
assertTrue(blanket.every(function (l) { return l.stitches === null; }), 'blanket: no stitch counts found on any line');

var blanketSummary = window.Patterns.summary(blanket);
assertSubset(blanketSummary, { rows: 3, maxRow: 3, hasTargets: false }, 'blanket summary: rows=3, maxRow=3, hasTargets=false');
assertEqual(window.Patterns.targetFor(blanket, 2), null, 'blanket targetFor(2) == null (row exists but no stitches)');
assertTrue(window.Patterns.lineFor(blanket, 2) !== null, 'blanket lineFor(2) still resolves the line even without stitches');
assertEqual(window.Patterns.lineFor(blanket, 2).row, 2, 'blanket lineFor(2).row == 2');

// -----------------------------------------------------------------------
group('Row marker styles: R12, numbered "12.", = 30, R5/R 5/Rnd5/Round 5');
// -----------------------------------------------------------------------

var r12 = window.Patterns.parse('R12 - dc in each st around')[0];
assertEqual({ row: r12.row, rowEnd: r12.rowEnd, stitches: r12.stitches }, { row: 12, rowEnd: 12, stitches: null }, '"R12 - ..." parses as row 12, no trailing count consumed as range');

var numbered = window.Patterns.parse('12. sc in each dc around (24)')[0];
assertEqual({ row: numbered.row, rowEnd: numbered.rowEnd, stitches: numbered.stitches }, { row: 12, rowEnd: 12, stitches: 24 }, '"12. ..." numbered style with trailing (24)');

var eqLine = window.Patterns.parse('Rnd 8: dc around = 30')[0];
assertEqual({ row: eqLine.row, stitches: eqLine.stitches }, { row: 8, stitches: 30 }, '"= 30" trailing count style');

assertEqual(window.Patterns.parse('R5')[0].row, 5, '"R5" (no space, no colon) -> row 5');
assertEqual(window.Patterns.parse('R 5')[0].row, 5, '"R 5" (space) -> row 5');
assertEqual(window.Patterns.parse('Rnd5')[0].row, 5, '"Rnd5" (no space) -> row 5');
assertEqual(window.Patterns.parse('Round 5')[0].row, 5, '"Round 5" -> row 5');
assertEqual(window.Patterns.parse('Row 5:')[0].row, 5, '"Row 5:" -> row 5');
assertEqual(window.Patterns.parse('5.')[0].row, 5, '"5." bare numbered marker -> row 5');
assertEqual(window.Patterns.parse('5:')[0].row, 5, '"5:" bare numbered marker -> row 5');
assertEqual(window.Patterns.parse('5)')[0].row, 5, '"5)" bare numbered marker -> row 5');

// -----------------------------------------------------------------------
group('En-dash / hyphen / "to" ranges');
// -----------------------------------------------------------------------

var enDash = window.Patterns.parse('Rnds 6–10: sc around (30)')[0];
assertEqual({ row: enDash.row, rowEnd: enDash.rowEnd, stitches: enDash.stitches }, { row: 6, rowEnd: 10, stitches: 30 }, 'en-dash range "Rnds 6–10" -> row 6, rowEnd 10');

var hyphenRange = window.Patterns.parse('Rows 5-8: sc across')[0];
assertEqual({ row: hyphenRange.row, rowEnd: hyphenRange.rowEnd }, { row: 5, rowEnd: 8 }, 'hyphen range "Rows 5-8"');

var toRange = window.Patterns.parse('Rnd 5 to 8: sc around')[0];
assertEqual({ row: toRange.row, rowEnd: toRange.rowEnd }, { row: 5, rowEnd: 8 }, '"to" word range "Rnd 5 to 8"');

// A bare range with nothing trailing: the range's own end number ("10")
// must never leak into stitches via the dash-count heuristic.
var bareRange = window.Patterns.parse('Rnd 6-10')[0];
assertEqual({ row: bareRange.row, rowEnd: bareRange.rowEnd, stitches: bareRange.stitches }, { row: 6, rowEnd: 10, stitches: null }, 'bare "Rnd 6-10" with no trailing text: rowEnd is NOT mistaken for a stitch count');

// -----------------------------------------------------------------------
group('Bullet-prefixed markers');
// -----------------------------------------------------------------------

assertEqual(window.Patterns.parse('- Rnd 5: 2dc in each st (12)')[0].row, 5, 'leading "- " bullet before Rnd marker');
assertEqual(window.Patterns.parse('- Rnd 5: 2dc in each st (12)')[0].stitches, 12, 'leading "- " bullet, count still parsed');
assertEqual(window.Patterns.parse('* Row 3: sc around (18 sts)')[0].row, 3, 'leading "*" bullet before Row marker');
assertEqual(window.Patterns.parse('• R7: sc around (21)')[0].row, 7, 'leading "•" bullet before R marker');

// -----------------------------------------------------------------------
group('Headers and non-row lines (should NOT be misread as markers)');
// -----------------------------------------------------------------------

var head = window.Patterns.parse('HEAD:')[0];
assertEqual({ row: head.row, stitches: head.stitches }, { row: null, stitches: null }, '"HEAD:" section header has no row/stitches');

var wings = window.Patterns.parse('Wings (make 2)')[0];
assertEqual({ row: wings.row, stitches: wings.stitches }, { row: null, stitches: null }, '"Wings (make 2)" header: parenthetical is not mistaken for a stitch count');

var tricky1 = window.Patterns.parse('5 sc in next st')[0];
assertEqual({ row: tricky1.row, stitches: tricky1.stitches }, { row: null, stitches: null }, '"5 sc in next st" leading number is NOT a row marker (no . : ) after it)');

var tricky2 = window.Patterns.parse('6 inc around')[0];
assertEqual({ row: tricky2.row, stitches: tricky2.stitches }, { row: null, stitches: null }, '"6 inc around" leading number is NOT a row marker');

assertEqual(window.Patterns.parse('Repeat rows 1-4 for pattern... continue')[0].row, null, '"Repeat rows..." (keyword not at very start after "Repeat") is not itself treated oddly - "Repeat" prefix has no digit right after "R" so no false match');

// -----------------------------------------------------------------------
group('Stitch-count formats at end of line');
// -----------------------------------------------------------------------

function st(line) { return window.Patterns.parse(line)[0].stitches; }

assertEqual(st('Rnd 1: sc around (30)'), 30, 'parens (30)');
assertEqual(st('Rnd 1: sc around [30]'), 30, 'brackets [30]');
assertEqual(st('Rnd 1: sc around (30 sts)'), 30, '(30 sts)');
assertEqual(st('Rnd 1: sc around (30 st)'), 30, '(30 st) singular');
assertEqual(st('Rnd 1: sc around (30 sc)'), 30, '(30 sc)');
assertEqual(st('Rnd 1: sc around (30 stitches)'), 30, '(30 stitches)');
assertEqual(st('Rnd 1: sc around (30 sts total)'), 30, '(30 sts total)');
assertEqual(st('Rnd 1: sc around = 30'), 30, '= 30');
assertEqual(st('Rnd 1: sc around – 30 sts'), 30, 'en dash – 30 sts');
assertEqual(st('Rnd 1: sc around - 30'), 30, 'hyphen - 30');
assertEqual(st('Rnd 1: sc around 30 sts'), 30, 'plain trailing 30 sts');
assertEqual(st('Rnd 1: sc around 30 sts.'), 30, 'plain trailing 30 sts. with period');
assertEqual(st('Rnd 1: dec around (24, 30)'), 30, '(24, 30) takes the LAST number');
assertEqual(st('Wings (make 2)'), null, '(make 2) is not count-like -> null');
assertEqual(st('Just a note with no count'), null, 'no trailing count -> null');

// -----------------------------------------------------------------------
group('targetFor vs lineFor: first-with-stitches vs first-in-range');
// -----------------------------------------------------------------------

var overlap = window.Patterns.parse('Row 5: something\nRow 5: something else (20)');
assertEqual(window.Patterns.targetFor(overlap, 5), 20, 'targetFor skips the row-5 line without stitches and uses the one that has a count');
assertEqual(window.Patterns.lineFor(overlap, 5).text, 'Row 5: something', 'lineFor returns the FIRST line in range regardless of stitches');

// -----------------------------------------------------------------------
group('Line endings (CRLF/CR/LF) and blank lines');
// -----------------------------------------------------------------------

var crlfText = 'Rnd 1: sc around (6)\r\nRnd 2: inc around (12)\r\n';
var crlf = window.Patterns.parse(crlfText);
assertEqual(crlf.length, 3, 'CRLF text splits into 3 lines (incl. trailing blank from final \\r\\n)');
assertEqual(crlf[0].row, 1, 'CRLF line 0 row parsed correctly (no stray \\r)');
assertEqual(crlf[1].stitches, 12, 'CRLF line 1 stitches parsed correctly');
assertEqual(crlf[2].text, '', 'CRLF trailing blank line has empty text');
assertEqual(crlf[2].row, null, 'CRLF trailing blank line has null row');

var blankMiddle = window.Patterns.parse('Rnd 1: sc (6)\n\nRnd 2: inc (12)');
assertEqual(blankMiddle.length, 3, 'blank line in the middle preserved as its own Line');
assertEqual(blankMiddle[1].row, null, 'blank middle line has null row');
assertEqual(blankMiddle[1].stitches, null, 'blank middle line has null stitches');
var blankSummary = window.Patterns.summary(blankMiddle);
assertEqual(blankSummary.rows, 2, 'blank line does not count toward summary.rows');

assertEqual(window.Patterns.parse('').length, 1, 'empty string parses to a single blank Line');
assertEqual(window.Patterns.parse(null).length, 0, 'null input -> empty array');
assertEqual(window.Patterns.parse(undefined).length, 0, 'undefined input -> empty array');

// -----------------------------------------------------------------------
group('summary() on empty / no-marker input');
// -----------------------------------------------------------------------

var noMarkers = window.Patterns.parse('Just some notes\nMore notes, no rows here');
assertSubset(window.Patterns.summary(noMarkers), { rows: 0, maxRow: null, hasTargets: false }, 'summary with no row markers at all: rows=0, maxRow=null, hasTargets=false');
assertSubset(window.Patterns.summary([]), { rows: 0, maxRow: null, hasTargets: false }, 'summary of empty array');
assertEqual(window.Patterns.summary([]).sections, [], 'summary of empty array: no sections');
assertEqual(window.Patterns.summary([]).suggestions, { targetRows: null, repeat: null }, 'summary of empty array: empty suggestions');
assertEqual(window.Patterns.targetFor([], 1), null, 'targetFor on empty array -> null');
assertEqual(window.Patterns.lineFor([], 1), null, 'lineFor on empty array -> null');

// =======================================================================
// v2 tests. All pattern snippets below are synthetic (written for this
// suite); they only mimic the SHAPE of real PDF text.
// =======================================================================

var P = window.Patterns;
function pick(line, keys) {
  var o = {};
  keys.forEach(function (k) { o[k] = line ? line[k] : undefined; });
  return o;
}
function rowOf(lines, n) {
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (l.row !== null && l.row >= 1 && n >= l.row && n <= l.rowEnd) return l;
  }
  return null;
}

// -----------------------------------------------------------------------
group('v2: Line shape');
// -----------------------------------------------------------------------

var shape = P.parse('Rnd 1: 6 sc in magic ring (6)')[0];
assertEqual(pick(shape, ['index', 'kind', 'row', 'rowEnd', 'section', 'stitches', 'sizes', 'computed', 'count', 'countSource', 'notes']),
  { index: 0, kind: 'row', row: 1, rowEnd: 1, section: 0, stitches: 6, sizes: null, computed: 6, count: 6, countSource: 'explicit', notes: [] },
  'v2 Line has kind/section/computed/count/countSource/notes');
assertEqual(P.parse('BODY')[0].kind, 'header', 'a header line has kind "header"');
assertEqual(P.parse('Just some chatter about hooks and yarn weight')[0].kind, 'note', 'plain prose has kind "note"');
assertEqual(P.parse('Repeat Rows 5-8 six times')[0].kind, 'repeat', 'a repeat line has kind "repeat"');
assertEqual(pick(P.parse('Setup: Ch 20, sc in each ch across, turn.')[0], ['kind', 'row', 'rowEnd']), { kind: 'setup', row: 0, rowEnd: 0 }, '"Setup:" -> kind setup, row 0');
assertEqual(pick(P.parse('Foundation row: Ch 20, sc in each ch across.')[0], ['kind', 'row']), { kind: 'setup', row: 0 }, '"Foundation row:" -> kind setup, row 0');

// -----------------------------------------------------------------------
group('v2: markers - Next Row, ranges with "to" and "&", (WS)/(RS)');
// -----------------------------------------------------------------------

assertEqual(pick(P.parse('Rows 5 to 8: sc across')[0], ['row', 'rowEnd']), { row: 5, rowEnd: 8 }, '"Rows 5 to 8" range');
assertEqual(pick(P.parse('Rows 5 & 6: sc across')[0], ['row', 'rowEnd']), { row: 5, rowEnd: 6 }, '"Rows 5 & 6" range');
assertEqual(P.parse('Row 7 (WS): ch 1, sc across')[0].row, 7, '"Row 7 (WS):" -> row 7');
assertEqual(P.parse('ROW 7: ch 1, sc across')[0].row, 7, 'upper-case "ROW 7"');
assertEqual(pick(P.parse('5-6. Sc in each st')[0], ['row', 'rowEnd']), { row: 5, rowEnd: 6 }, 'bare range "5-6."');
assertEqual(pick(P.parse('8-11..sc in each st')[0], ['row', 'rowEnd']), { row: 8, rowEnd: 11 }, 'PDF typo range "8-11.."');
assertEqual(P.parse('6..Inc, 4sc, repeat around')[0].row, 6, 'PDF typo "6..Inc"');
assertEqual(P.parse('2 sl sts on the edge')[0].row, null, '"2 sl sts ..." is not a row marker');
assertEqual(P.parse('5 sc in next st')[0].row, null, '"5 sc in next st" is not a row marker');
var nextRows = P.parse('Row 1: sc across\nRows 2-3: sc across\nNext Row: sc across');
assertEqual(pick(nextRows[2], ['kind', 'row', 'rowEnd']), { kind: 'row', row: 4, rowEnd: 4 }, '"Next Row:" after rows 2-3 -> row 4');

// -----------------------------------------------------------------------
group('v2: evaluate()');
// -----------------------------------------------------------------------

assertEqual(P.evaluate('6 sc in magic ring', null), 6, 'evaluate: 6 sc in magic ring -> 6');
assertEqual(P.evaluate('5sc in mr', null), 5, 'evaluate: 5sc in mr -> 5');
assertEqual(P.evaluate('6st in mr', null), 6, 'evaluate: 6st in mr -> 6');
assertEqual(P.evaluate('MR with 8 sc', null), 8, 'evaluate: MR with 8 sc -> 8');
assertEqual(P.evaluate('Inc in each st', 5), 10, 'evaluate: inc in each st -> prev x2');
assertEqual(P.evaluate('Inc in eact st', 6), 12, 'evaluate: tolerates the "eact" typo');
assertEqual(P.evaluate('Sc in each st', 15), 15, 'evaluate: sc in each st -> prev');
assertEqual(P.evaluate('sc in each st around', 30), 30, 'evaluate: sc in each st around -> prev');
assertEqual(P.evaluate('blo sc in each st across', 184), 184, 'evaluate: blo sc in each st across -> prev');
assertEqual(P.evaluate('work even', 40), 40, 'evaluate: work even -> prev');
assertEqual(P.evaluate('Dec in each st', 10), 5, 'evaluate: dec in each st -> prev/2');
assertEqual(P.evaluate('Dec all around', 12), 6, 'evaluate: dec all around -> prev/2');
assertEqual(P.evaluate('Inc, sc, repeat around', 10), 15, 'evaluate: "Inc, sc, repeat around" fills the group');
assertEqual(P.evaluate('Inc, 4sc, repeat around', 30), 36, 'evaluate: "Inc, 4sc, repeat around" from 30 -> 36');
assertEqual(P.evaluate('Dec, 5sc, repeat around', 42), 36, 'evaluate: "Dec, 5sc, repeat around" from 42 -> 36');
assertEqual(P.evaluate('Inc, 5sc, repeat around Eyes placement can vary slightly', 36), 42, 'evaluate: trailing commentary after "repeat around" is ignored');
assertEqual(P.evaluate('*sc, inc* rep around', 12), 18, 'evaluate: *...* group + "rep around" -> 18');
assertEqual(P.evaluate('(sc 3, inc) x6', 24), 30, 'evaluate: (sc 3, inc) x6 -> 30');
assertEqual(P.evaluate('(sc 3, inc) x6 (30)', 24), 30, 'evaluate: a trailing "(30)" count is not counted twice');
assertEqual(P.evaluate('Ch1, turn (flip project), (Inc, sc) x5, inc', 12), 17, 'evaluate: (Inc, sc) x5, inc -> 17');
assertEqual(P.evaluate('Ch1, turn, (inc, 2sc) x5, inc, sc', 17), 23, 'evaluate: (inc, 2sc) x5, inc, sc -> 23');
assertEqual(P.evaluate('Ch1, turn, (inc, 3sc) x5, inc, 2sc', 23), 29, 'evaluate: (inc, 3sc) x5, inc, 2sc -> 29');
assertEqual(P.evaluate('Ch1, turn, (inc, 4sc) x5, inx, 3sc', 29), 35, 'evaluate: tolerates the "inx" typo -> 35');
assertEqual(P.evaluate('(sc, inc) repeat 6 times', 12), 18, 'evaluate: "repeat 6 times" multiplier');
assertEqual(P.evaluate('(sc, inc) rep from * 5 more times', 12), 18, 'evaluate: "5 more times" = 6 repeats');
assertEqual(P.evaluate('sc 6', null), 6, 'evaluate: "sc 6" -> 6');
assertEqual(P.evaluate('6sc', null), 6, 'evaluate: "6sc" -> 6');
assertEqual(P.evaluate('2 sc in each st', 6), 12, 'evaluate: "2 sc in each st" -> prev x2');
assertEqual(P.evaluate('Sk 2 sl sts, blo sc 7, turn.', 7), 7, 'evaluate: "Sk 2 sl sts, blo sc 7, turn." -> 7');
assertEqual(P.evaluate('mumble mumble not crochet at all', 30), null, 'evaluate: unknown text -> null (never guess)');
assertEqual(P.evaluate('sc in each st', null), null, 'evaluate: fill rule with no previous count -> null');

// -----------------------------------------------------------------------
group('v2: open-ended fills inherit the previous count');
// -----------------------------------------------------------------------

var puffRow = 'Row 3: Ch 1, blo sc 10, [skip the next st, sc in next, work a puff st into the skipped st] work across until the last 10 sts, blo sc 10, turn.';
assertEqual(P.evaluate(puffRow, 184), 184, 'puff row with "work across until the last 10 sts" -> previous count');
assertEqual(P.evaluate('Ch 1, [skip the next st, sc in next, work a puff st into the skipped st] work across, turn.', 18), 18, '"... work across, turn." -> previous count');
assertEqual(P.evaluate('ch 1, *sc, puff; rep from * across', 40), 40, '"rep from * across" -> previous count');
assertEqual(P.evaluate('ch 1, *sc, puff; rep from * around', 40), 40, '"rep from * around" -> previous count');
assertEqual(P.evaluate('Ch 1, work in pattern across, turn.', 88), 88, '"work in pattern across" -> previous count');
assertEqual(P.evaluate('Continue in the established pattern, turn.', 88), 88, '"continue in the established pattern" -> previous count');
assertEqual(P.evaluate('Ch 1, sc in each st to end, turn.', 24), 24, '"to end" -> previous count');
assertEqual(P.evaluate(puffRow, null), null, 'an open-ended fill with no previous count stays null');
assertEqual(P.evaluate('(sc, inc) rep from * 5 more times', 12), 18, '"rep from * 5 more times" is still a counted repeat, not an open-ended fill');
assertEqual(P.evaluate('Inc, 5sc, repeat around', 36), 42, '"repeat around" still fills the group rather than inheriting');

var puffPiece = P.parse(
  'Row 1: Ch 1, blo sc in each st across, turn. | 184 (208, 224) sts\n' +
  puffRow + '\n' +
  'Rows 4-5: Ch 1, blo sc in each st across, turn.');
assertEqual(pick(rowOf(puffPiece, 3), ['count', 'countSource']), { count: 184, countSource: 'computed' }, 'the puff row computes 184 inside a parsed piece');
assertEqual(rowOf(puffPiece, 5).count, 184, 'the rows after it keep counting from 184');

// a restarted (unnamed) section carries the running count over
var carry = P.parse(
  'Row 1: Ch 1, blo sc in each st across, turn. | 88 sts\n' +
  'Row 2: Ch 1, blo sc in each st across, turn.\n' +
  'Rows 1-2: Ch 1, blo sc in each st across, turn.');
assertEqual(carry[2].section, 1, 'the repeated row numbers start a new section');
assertEqual(carry[2].count, 88, 'a restarted section inherits the previous count');

// the "Name: instructions" one-liner (a whole piece on one line)
var stemText = 'Stem: With MC, ch 40. Sl st in 2nd ch from hook. Sl st in each of next 11 ch. ' +
  '1 sc in each of next 9 ch. 1 hdc in each of next 6 ch. 1 dc in each of next 6 ch. ' +
  '1 tr in each of next 6 ch. Fasten off.';
var stem = P.parse(stemText);
var stemSum = P.summary(stem);
assertEqual(stemSum.rows, 1, 'stem one-liner: exactly one row');
assertEqual(pick(stem[0], ['kind', 'row', 'rowEnd', 'count', 'countSource']), { kind: 'row', row: 1, rowEnd: 1, count: 39, countSource: 'computed' }, 'stem one-liner: row 1, computed 39 (1 + 11 + 9 + 6 + 6 + 6)');
assertEqual(stemSum.sections.length && stemSum.sections[0].name, 'Stem', 'stem one-liner: section named "Stem"');

// -----------------------------------------------------------------------
group('v2: computed counts through a whole piece');
// -----------------------------------------------------------------------

var beeish =
  'BODY\n' +
  '1. 5sc in mr\n' +
  '2. Inc in eact st\n' +
  'Colour change to black\n' +
  '3. Inc, sc, repeat around\n' +
  '4. Sc in each st\n' +

// A bare instruction, parsed as row 1 so expand() can find it.
function expandOf(instr, prev, state) {
  return P.expand(P.parse('1. ' + instr), 1, prev, state || null);
}
function typesOf(instr, prev) {
  return expandOf(instr, prev).stitches.map(function (s) { return s.t; }).join(',');
}

// expand() must produce exactly as many stitches as evaluate() counts.
[
  ['6 sc in magic ring', null],
  ['Inc x 6', 6],
  ['(Sc 1, Inc) x 6', 12],
  ['(Sc 2, Inc) x 6', 18],
  ['(Sc 3, Inc) x 6', 24],
  ['Sc around', 30],
  ['(Sc 3, Dec) x 6', 30],
  ['Dec x 6', 12],
  ['(inc, 2sc) x5, inc, sc', 15],
  ['Inc, sc, repeat around', 10],
  ['Dec, 2sc, repeat around', 24],
  ['Skip 1st stitch, 13Sc', 14],
  ['Skip 1st stitch, 3Hdc in each stitch', 21],
  ['Hdc 7, Hdc Dec', 9],
  ['Sc 10 , A (Sc 3) , Sc 3 , A (Sc 3) , Sc 11', 30],
  ['A (Hdc Inc x 5) , Hdc Inc x 13', 18],
  ['Sc, (Bbl, Slst)x5, 7sc', 18],
  ['2Sc, (Inc, Sc, Bbl, Inc, 2Sc)x2, Inc, 2Sc, Inc', 18],
  ['(2sc, Dec)x4, Dec', 18],
  ['Increase around', 5],
  ['11HdcInc', 12],
  ['5 Sc in Magic Ring', null],
  ['Sc in each st', 24],
  ['Mr6', null],
  ['3Hdc in each stitch', 20],
  ['Hdc 10', null],
  ['Dc 8', null],
  ['Tr 6', null]
].forEach(function (c) {
  var want = P.evaluate(c[0], c[1]);
  var got = expandOf(c[0], c[1]).stitches.length;
  log(want !== null && got === want, 'expand == evaluate for "' + c[0] + '" (prev ' + c[1] + ')',
    'evaluate ' + want + ', expand ' + got);
});

assertEqual(typesOf('Inc x 6', 6), 'inc,inc,inc,inc,inc,inc,inc,inc,inc,inc,inc,inc', 'inc yields TWO entries of t:"inc"');

group('v2.2: PdfText - letter-spaced pages');
// -----------------------------------------------------------------------

// Some PDFs kern every glyph apart, so pdf.js hands back "R 2 : s c i n c".
// The word breaks survive as items of their own, which is what the repair
// leans on. These rows are modelled on tmp-pdf/crochet-snowman.pdf.
function pdfItem(str, x, w, y) {
  return { str: str, width: w, height: 14.36, transform: [1, 0, 0, 14.36, x, y] };
}
function spacedRowItems(y) {
  return [
    pdfItem('R 2 :', 32.6, 26.63, y), pdfItem(' ', 59.24, 14.47, y),
    pdfItem('s c', 68.85, 17.04, y), pdfItem(' ', 85.89, 14.47, y),
    pdfItem('i n c', 95.51, 24.71, y), pdfItem(' ', 120.22, 14.47, y),
    pdfItem('x 6', 129.83, 18.29, y), pdfItem(' ', 148.13, 14.47, y),
    pdfItem('( 1 2 )', 157.74, 36.98, y)
  ];
}
function plainRowItems(y) {
  return [
    pdfItem('Rnd 2:', 32.6, 40, y), pdfItem(' ', 72.6, 8, y),
    pdfItem('2 sc in each st around.', 80.6, 120, y), pdfItem(' ', 200.6, 8, y),
    pdfItem('(12)', 208.6, 24, y)
  ];
}

if (!window.PdfText || !window.PdfText._rowText) {
  log(false, 'PdfText helpers available to the test page');
} else {
  var PT = window.PdfText;
  var spacedRow = PT._buildRows(spacedRowItems(650))[0];
  assertEqual(PT._rowText(spacedRow, false), 'R 2 : s c i n c x 6 ( 1 2 )',
    'without the repair a letter-spaced line is one space per glyph');
  assertEqual(PT._rowText(spacedRow, true), 'R2: sc inc x6 (12)',
    'the repair drops the spaces inside an item and keeps the ones between items');

  var plainRow = PT._buildRows(plainRowItems(650))[0];
  assertEqual(PT._rowText(plainRow, true), 'Rnd 2: 2 sc in each st around. (12)',
    'an ordinary line is unchanged even when the repair is switched on');

  var spacedPage = [];
  [700, 680, 660, 640].forEach(function (y) { spacedPage = spacedPage.concat(spacedRowItems(y)); });
  assertTrue(PT._pageLooksSpaced(PT._buildRows(spacedPage)), 'four letter-spaced lines make a letter-spaced page');

  var plainPage = [];
  [700, 680, 660, 640, 620].forEach(function (y) { plainPage = plainPage.concat(plainRowItems(y)); });
  assertTrue(!PT._pageLooksSpaced(PT._buildRows(plainPage)), 'an ordinary page is not letter-spaced');

  // one stray "A B C" photo label among ordinary lines must not tip a page over
  var labelPage = plainPage.concat([
    pdfItem('A', 32.6, 8, 600), pdfItem(' ', 40.6, 8, 600),
    pdfItem('B', 48.6, 8, 600), pdfItem(' ', 56.6, 8, 600), pdfItem('C', 64.6, 8, 600)
  ]);
  assertTrue(!PT._pageLooksSpaced(PT._buildRows(labelPage)), 'a lone "A B C" label does not make a page letter-spaced');
}

group('v2.3: PdfText - callouts drawn over artwork');
// -----------------------------------------------------------------------

if (!window.PdfText || !window.PdfText._labelRows) {
  log(false, 'PdfText callout helpers available to the test page');
} else {
  var PT2 = window.PdfText;

  /** One text item. `rot` draws it turned 90 degrees, as a callout is. */
  function gItem(str, x, y, h, rot) {
    return {
      str: str, width: str.length * (h * 0.46), height: h,
      transform: rot ? [0, h, -h, 0, x, y] : [h, 0, 0, h, x, y]
    };
  }
  /** A column of lines, top down, one per string. */
  function gCol(strs, y0, pitch, h, x) {
    return strs.map(function (s, i) { return gItem(s, x, y0 - i * pitch, h); });
  }

  var bodyLines = ['R1: MR8', 'R2: Incx8 [16]', 'R3: (sc, inc)x8 [24]', 'R4: (sc, inc)x12 [36]',
    'R5: 36sc around', 'R6: 36sc around', 'R7: 36sc around', 'R8: (2sc, dec)x9 [27]'];
  var bodyItems = gCol(bodyLines, 700, 16, 12, 60);

  var mixed = bodyItems.concat([gItem('Arm', 230, 140, 12, true), gItem('goes', 246, 138, 12, true)]);
  assertEqual(PT2._dropRotated(mixed).length, bodyItems.length,
    'sideways callouts are dropped from a page that is otherwise upright');
  assertEqual(PT2._buildRows(mixed).length, bodyLines.length, '...so they never become rows');
  var sideways = gCol(bodyLines, 700, 16, 12, 60).map(function (it) {
    return gItem(it.str, it.transform[4], it.transform[5], 12, true);
  });
  assertEqual(PT2._dropRotated(sideways).length, bodyLines.length,
    'a page set entirely sideways is landscape typesetting, and all of it is kept');

  assertEqual(PT2._dominantHeight(PT2._buildRows(bodyItems.concat([gItem('Body/Head', 60, 730, 23)]))), 12,
    'the dominant height is the body text, not the one big heading');
  assertEqual(PT2._medianPitch(PT2._buildRows(bodyItems)), 16, 'the median pitch of an even column is its line spacing');

  function dropped(extra, bodyH) {
    var rows = PT2._buildRows(bodyItems.concat(extra));
    var map = PT2._labelRows(rows, bodyH === undefined ? 12 : bodyH, false);
    return Object.keys(map).map(function (k) { return rows[k].items[0].str; }).sort();
  }

  assertEqual(dropped(gCol(['4 sc between', 'Eye placement'], 200, 16, 12, 60)),
    ['4 sc between', 'Eye placement'],
    'a short run floating well below the column is a caption');
  assertEqual(dropped(gCol(['Sleeve Cuff'], 200, 16, 20, 60)), [],
    'a line set bigger than the body text is a heading, and is kept');
  assertEqual(dropped(gCol(['3sc through both sides of tail and body'], 200, 16, 7.3, 60)),
    ['3sc through both sides of tail and body'],
    'fine print floating below the column is a caption however long it is');
  assertEqual(dropped(gCol(['R9: (sc, dec)x5, sc [11]', 'R10-R11: 11sc around'], 200, 16, 12, 60)), [],
    'a floating block that still carries row markers is pattern text');
  assertEqual(dropped(gCol(['Stuff lightly', 'Fold in half'], 700 - 8 * 16, 16, 12, 60)), [],
    'short trailer notes that follow on at the column\'s own spacing are kept');
  assertEqual(PT2._labelRows(PT2._buildRows(bodyItems), 12, false), {},
    'a column with nothing floating loses nothing');
}
