<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XStitch.js tests</title>
<style>
  body { font: 14px/1.4 Menlo, Consolas, monospace; background:#111; color:#eee; padding:16px; }
  .pass { color:#7bd389; }
  .fail { color:#ff6b6b; background:#2a1414; }
  .note { color:#c9a227; }
  .group { margin-top:18px; font-weight:bold; color:#9cf; border-bottom:1px solid #333; padding-bottom:4px; }
  #summary { margin-top:20px; font-size:18px; font-weight:bold; }
  #summary.ok { color:#7bd389; }
  #summary.bad { color:#ff6b6b; }
  pre { white-space:pre-wrap; }
</style>
</head>
<body>
<h1>XStitch.js test suite</h1>
<div id="out"></div>
<div id="summary"></div>

<script>
// The Browser pane caches ../js/xstitch.js hard, so the suite always tests the
// file that is actually on disk. Dev-only page; document.write keeps script
// order, so the assertions below still run after the module has evaluated.
document.write('<scr' + 'ipt src="../js/xstitch.js?v=' + Date.now() + '"><\/scr' + 'ipt>');
</script>
<script>
'use strict';

var out = document.getElementById('out');
var passed = 0;
var failed = 0;

function log(ok, label, detail) {
  if (ok) { passed++; } else { failed++; }
  var line = (ok ? 'PASS' : 'FAIL') + ' - ' + label + (detail ? '  (' + detail + ')' : '');
  var div = document.createElement('div');
  div.className = ok ? 'pass' : 'fail';
  div.textContent = line;
  out.appendChild(div);
  if (ok) { console.log(line); } else { console.error(line); }
}

function note(text) {
  var div = document.createElement('div');
  div.className = 'note';
  div.textContent = '     ' + text;
  out.appendChild(div);
  console.log(text);
}

function group(title) {
  var div = document.createElement('div');
  div.className = 'group';
  div.textContent = title;
  out.appendChild(div);
  console.log('== ' + title + ' ==');
}

function deepEqual(a, b) {
  if (a === b) return true;
  if (a === null || b === null) return a === b;
  if (typeof a !== typeof b) return false;
  if (typeof a !== 'object') return a === b;
  var ak = Object.keys(a), bk = Object.keys(b);
  if (ak.length !== bk.length) return false;
  for (var i = 0; i < ak.length; i++) {
    var k = ak[i];
    if (!deepEqual(a[k], b[k])) return false;
  }
  return true;
}

function assertEqual(actual, expected, label) {
  var ok = deepEqual(actual, expected);
  log(ok, label, ok ? '' : ('expected ' + JSON.stringify(expected) + ' got ' + JSON.stringify(actual)));
}

function assertTrue(cond, label, detail) {
  log(!!cond, label, cond ? '' : (detail || ''));
}

function assertClose(actual, expected, tol, label) {
  var ok = typeof actual === 'number' && isFinite(actual) && Math.abs(actual - expected) <= tol;
  log(ok, label, ok ? '' : ('expected ' + expected + ' +/-' + tol + ' got ' + actual));
}

function assertSubset(actual, expected, label) {
  var sub = {};
  Object.keys(expected).forEach(function (k) { sub[k] = actual ? actual[k] : undefined; });
  assertEqual(sub, expected, label);
}

var X = window.XStitch;

/* =====================================================================
 * 1. Module shape
 * ===================================================================== */
group('Module shape and standalone load');

assertTrue(!!X, 'window.XStitch exists');
assertTrue(!window.Store, 'loads standalone: no Store on the page, and nothing threw');
var API = ['normalize', 'summary', 'hexFor', 'nearestFloss', 'rgbToLab', 'deltaE76', 'deltaE2000',
  'assignSymbols', 'packCells', 'unpackCells', 'packBits', 'unpackBits', 'getBit', 'setBit',
  'finishedSize', 'sizeTable', 'lengthPerStitchCm', 'skeinsFor', 'skeinRange', 'confetti',
  'progressStats', 'parseOXS', 'toOXS', 'parseKey', 'extractGrid', 'printableHTML'];
(function () {
  var missing = [];
  for (var i = 0; i < API.length; i++) if (typeof X[API[i]] !== 'function') missing.push(API[i]);
  assertTrue(missing.length === 0, 'all ' + API.length + ' public functions are present', missing.join(','));
})();
assertTrue(Array.isArray(X.TEMPLATES) && X.TEMPLATES.length === 3, 'TEMPLATES is an array of 3');
assertTrue(Array.isArray(X.SYMBOLS) && X.SYMBOLS.length >= 60, 'SYMBOLS has at least 60 glyphs');
assertTrue(!!X.FLOSS && Array.isArray(X.FLOSS.dmc), 'FLOSS.dmc is an array');
assertTrue(X.printableHTML({}).indexOf('<!DOCTYPE html>') === 0,
  'printableHTML always returns a whole document, even for an empty project');

/* =====================================================================
 * 2. DMC table and hexFor
 * ===================================================================== */
group('DMC floss table (MIT, sharlagelfand/dmc)');

assertEqual(X.FLOSS.dmc.length, 454, 'FLOSS.dmc has 454 colours');
(function () {
  var bad = 0, e;
  for (var i = 0; i < X.FLOSS.dmc.length; i++) {
    e = X.FLOSS.dmc[i];
    if (typeof e.code !== 'string' || !e.code) bad++;
    else if (typeof e.name !== 'string' || !e.name) bad++;
    else if (!/^[0-9a-f]{6}$/.test(e.hex)) bad++;
    else if (!(e.r >= 0 && e.r <= 255 && e.g >= 0 && e.g <= 255 && e.b >= 0 && e.b <= 255)) bad++;
  }
  assertEqual(bad, 0, 'every entry has code, name, 6-hex lower-case hex and r/g/b in 0..255');
})();
(function () {
  var seen = {}, dupes = 0;
  for (var i = 0; i < X.FLOSS.dmc.length; i++) {
    if (seen[X.FLOSS.dmc[i].code]) dupes++;
    seen[X.FLOSS.dmc[i].code] = 1;
  }
  assertEqual(dupes, 0, 'no duplicate DMC codes');
})();
(function () {
  var e = X.flossFor('DMC', '310');
  assertEqual([e.r, e.g, e.b], [0, 0, 0], 'r/g/b derived from the hex (310 -> 0,0,0)');
})();

assertEqual(X.hexFor('DMC', '310'), '000000', "hexFor('DMC','310') is black");
assertEqual(X.hexFor('', '310'), '000000', 'an empty brand is treated as DMC');
assertEqual(X.hexFor('dmc', '3799'), '424242', 'brand match is case-insensitive');
assertEqual(X.hexFor('DMC', '0310'), '000000', 'leading zeros are tolerated');
assertEqual(X.hexFor('DMC', ' 666 '), 'e31d42', 'surrounding whitespace is tolerated');
assertEqual(X.hexFor('DMC', 'Blanc'), 'fcfbf8', "'Blanc' maps to White");
assertEqual(X.hexFor('DMC', 'blanc'), 'fcfbf8', "'blanc' is case-insensitive");
assertEqual(X.hexFor('DMC', 'White'), 'fcfbf8', "'White' is a valid code");
assertEqual(X.hexFor('DMC', 'B5200'), 'ffffff', "'B5200' is snow white");
assertEqual(X.hexFor('DMC', 'Snow White'), 'ffffff', "'Snow White' aliases B5200");
assertEqual(X.hexFor('DMC', 'Ecru'), 'f0eada', "'Ecru' is a valid code");
assertEqual(X.hexFor('DMC', '99999'), null, 'an unknown DMC code returns null');
assertEqual(X.hexFor('Anchor', '403'), null, 'Anchor returns null in v1 (no colour data)');
assertEqual(X.hexFor('Madeira', '2400'), null, 'Madeira returns null in v1');

/* =====================================================================
 * 3. Colour maths
 * ===================================================================== */
group('Colour maths: sRGB -> Lab, deltaE76, CIEDE2000');

(function () {
  var white = X.rgbToLab(255, 255, 255);
  assertClose(white[0], 100, 0.01, 'rgbToLab white L* = 100');
  assertClose(white[1], 0, 0.01, 'rgbToLab white a* = 0');
  assertClose(white[2], 0, 0.01, 'rgbToLab white b* = 0');
  var black = X.rgbToLab(0, 0, 0);
  assertEqual([black[0], black[1], black[2]], [0, 0, 0], 'rgbToLab black is [0,0,0]');
  var mid = X.rgbToLab(128, 128, 128);
  assertClose(mid[0], 53.585, 0.01, 'rgbToLab 50% grey L* ~ 53.59');
  assertEqual(X.rgbToLab([255, 0, 0]).length, 3, 'rgbToLab accepts an [r,g,b] array');
  var viaObj = X.rgbToLab({ r: 255, g: 0, b: 0 });
  assertClose(viaObj[0], X.rgbToLab(255, 0, 0)[0], 1e-9, 'rgbToLab accepts an {r,g,b} object');
})();

assertEqual(X.deltaE76([50, 0, 0], [50, 0, 0]), 0, 'deltaE76 of a colour with itself is 0');
assertClose(X.deltaE76([50, 0, 0], [50, 3, 4]), 5, 1e-9, 'deltaE76 is plain Euclidean distance');

/* Published CIEDE2000 test data (Sharma, Wu & Dalal). */
assertClose(X.deltaE2000([50, 2.6772, -79.7751], [50, 0, -82.7485]), 2.0425, 0.0002, 'CIEDE2000 reference pair 1 -> 2.0425');
assertClose(X.deltaE2000([50, 3.1571, -77.2803], [50, 0, -82.7485]), 2.8615, 0.0002, 'CIEDE2000 reference pair 2 -> 2.8615');
assertClose(X.deltaE2000([50, -1.3802, -84.2814], [50, 0, -82.7485]), 1.0000, 0.0002, 'CIEDE2000 reference pair 4 -> 1.0000 (hue-rotation term)');
assertClose(X.deltaE2000([50, 0, 0], [50, -1, 2]), 2.3669, 0.0002, 'CIEDE2000 reference pair 7 -> 2.3669');
assertClose(X.deltaE2000([50, -1, 2], [50, 0, 0]), 2.3669, 0.0002, 'CIEDE2000 is symmetric (pair 8)');
assertClose(X.deltaE2000([50, 2.4900, -0.0010], [50, -2.4900, 0.0009]), 7.1792, 0.0002, 'CIEDE2000 reference pair 9 -> 7.1792');
assertClose(X.deltaE2000([60.2574, -34.0099, 36.2677], [60.4626, -34.1751, 39.4387]), 1.2644, 0.0002, 'CIEDE2000 reference pair 15 -> 1.2644');
assertEqual(X.deltaE2000([50, 2, -3], [50, 2, -3]), 0, 'CIEDE2000 of a colour with itself is 0');

(function () {
  var near = X.nearestFloss([0, 0, 0], { brand: 'DMC', limit: 3 });
  assertEqual(near.length, 3, 'nearestFloss honours limit');
  assertEqual(near[0].code, '310', 'nearestFloss of pure black is DMC 310');
  assertClose(near[0].de, 0, 1e-9, 'an exact match has deltaE 0');
  assertTrue(near[0].de <= near[1].de && near[1].de <= near[2].de, 'nearestFloss results are sorted by deltaE');
  var byHex = X.nearestFloss('#e31d42', { limit: 1 });
  assertEqual(byHex[0].code, '666', 'nearestFloss accepts a hex string');
  var byLab = X.nearestFloss({ lab: X.rgbToLab(66, 66, 66) }, { limit: 1 });
  assertEqual(byLab[0].code, '3799', 'nearestFloss accepts a Lab input');
  assertEqual(X.nearestFloss([0, 0, 0], { brand: 'Anchor' }), [], 'nearestFloss returns [] for a brand we have no data for');
  var de76 = X.nearestFloss([120, 40, 200], { limit: 1, metric: 'de76' });
  assertTrue(de76.length === 1 && typeof de76[0].de === 'number', 'nearestFloss supports the de76 metric');
})();

/* =====================================================================
 * 4. Symbols
 * ===================================================================== */
group('Symbols');

(function () {
  var bad = [];
  for (var i = 0; i < X.SYMBOLS.length; i++) {
    if ('0OoIl1'.indexOf(X.SYMBOLS[i]) >= 0) bad.push(X.SYMBOLS[i]);
  }
  assertEqual(bad, [], 'SYMBOLS contains none of the confusable glyphs 0 O o I l 1');
  var seen = {}, dup = 0;
  for (var k = 0; k < X.SYMBOLS.length; k++) {
    if (seen[X.SYMBOLS[k]]) dup++;
    seen[X.SYMBOLS[k]] = 1;
  }
  assertEqual(dup, 0, 'SYMBOLS has no duplicates');
})();

function palFixture() {
  return [
    { i: 0, hex: '000000', stitchCount: 1200, symbol: '' },
    { i: 1, hex: 'ffffff', stitchCount: 40, symbol: '' },
    { i: 2, hex: 'e31d42', stitchCount: 800, symbol: '' },
    { i: 3, hex: '424242', stitchCount: 50, symbol: '' },
    { i: 4, hex: 'b8d2e6', stitchCount: 300, symbol: '' },
    { i: 5, hex: '94a8c6', stitchCount: 120, symbol: '' }
  ];
}

(function () {
  var a = X.assignSymbols(palFixture());
  var b = X.assignSymbols(palFixture());
  var symsA = a.map(function (p) { return p.symbol; });
  var symsB = b.map(function (p) { return p.symbol; });
  assertEqual(symsA, symsB, 'assignSymbols is deterministic for a fixed palette');
  var seen = {}, dup = 0;
  for (var i = 0; i < symsA.length; i++) { if (seen[symsA[i]]) dup++; seen[symsA[i]] = 1; }
  assertEqual(dup, 0, 'assignSymbols gives every colour a distinct glyph');
  assertEqual(a[0].symbol, X.SYMBOLS[0], 'the highest stitchCount colour gets the lowest-ink glyph');
  var allInSet = true;
  for (var k = 0; k < symsA.length; k++) if (X.SYMBOLS.indexOf(symsA[k]) < 0) allInSet = false;
  assertTrue(allInSet, 'all assigned glyphs come from SYMBOLS for a 6-colour palette');
  assertTrue(X.assignSymbols([]) !== undefined, 'assignSymbols survives an empty palette');
})();

(function () {
  /* 80 colours: more than the curated set, so the overflow pool kicks in. */
  var big = [];
  for (var i = 0; i < 80; i++) {
    var v = (i * 3) % 256;
    var hx = ('0' + v.toString(16)).slice(-2);
    big.push({ i: i, hex: hx + hx + hx, stitchCount: 1000 - i, symbol: '' });
  }
  X.assignSymbols(big);
  var seen = {}, dup = 0;
  for (var k = 0; k < big.length; k++) { if (seen[big[k].symbol]) dup++; seen[big[k].symbol] = 1; }
  assertEqual(dup, 0, 'an 80-colour palette still gets 80 distinct glyphs');
})();

assertEqual(X.symbolInk('000000'), 'light', 'a dark swatch takes a light glyph (L* < 50)');
assertEqual(X.symbolInk('ffffff'), 'dark', 'a light swatch takes a dark glyph');

/* =====================================================================
 * 5. Packing
 * ===================================================================== */
group('Packing: RLE cells and base64 bitmaps');

(function () {
  var cells = new Int16Array([-1, -1, -1, 3, 3, 0]);
  var packed = X.packCells(cells, 3, 2);
  assertEqual(packed, { enc: 'rle', data: '-1x3,3x2,0x1' }, "packCells produces '<idx>x<run>' segments");
  var back = X.unpackCells(packed);
  assertEqual(Array.prototype.slice.call(back), [-1, -1, -1, 3, 3, 0], 'unpackCells round-trips');
  assertTrue(back instanceof Int16Array, 'unpackCells returns an Int16Array');
  assertEqual(Array.prototype.slice.call(X.unpackCells('2,5x2')), [2, 5, 5], 'a bare segment means a run of one');
  assertEqual(Array.prototype.slice.call(X.unpackCells('')), [], 'an empty packing unpacks to an empty array');
  assertEqual(Array.prototype.slice.call(X.unpackCells('nonsense')), [], 'garbage unpacks to an empty array, not a throw');
  assertEqual(X.packCells([], 0, 0), { enc: 'rle', data: '' }, 'packing nothing gives an empty string');
})();

var bigW = 200, bigH = 250, bigN = bigW * bigH;
var bigCells = new Int16Array(bigN);
(function () {
  /* deterministic pseudo-random grid over 24 colours plus empties */
  var seed = 1234567;
  for (var i = 0; i < bigN; i++) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    var v = seed % 26;
    bigCells[i] = v >= 24 ? -1 : v;
  }
})();

var packTime = 0, unpackTime = 0, bigPacked = null;
(function () {
  var t0 = performance.now();
  bigPacked = X.packCells(bigCells, bigW, bigH);
  packTime = performance.now() - t0;
  var t1 = performance.now();
  var round = X.unpackCells(bigPacked);
  unpackTime = performance.now() - t1;
  assertEqual(round.length, bigN, '200x250 round-trip keeps all 50,000 cells');
  var same = true;
  for (var i = 0; i < bigN; i++) if (round[i] !== bigCells[i]) { same = false; break; }
  assertTrue(same, '200x250 random grid round-trips byte for byte');
})();

(function () {
  var n = 1000;
  var bits = new Uint8Array(n);
  for (var i = 0; i < n; i++) bits[i] = (i % 7 === 0 || i % 13 === 0) ? 1 : 0;
  var b64 = X.packBits(bits, n);
  assertTrue(typeof b64 === 'string' && b64.length > 0, 'packBits returns a base64 string');
  assertEqual(b64.length, Math.ceil(Math.ceil(n / 8) / 3) * 4, 'packBits is ceil(n/8) bytes of base64');
  var back = X.unpackBits(b64, n);
  var same = true;
  for (var k = 0; k < n; k++) if (back[k] !== bits[k]) { same = false; break; }
  assertTrue(same, 'packBits/unpackBits round-trip 1,000 bits');
  assertEqual(X.countBits(b64, n), (function () { var c = 0; for (var j = 0; j < n; j++) c += bits[j]; return c; })(),
    'countBits matches a manual popcount');
  assertEqual(X.getBit(b64, 0), true, 'getBit reads bit 0');
  assertEqual(X.getBit(b64, 1), false, 'getBit reads a clear bit');
  assertEqual(X.getBit(b64, 7), true, 'getBit reads across into the next byte group');
  assertEqual(X.getBit(b64, 999), bits[999] === 1, 'getBit reads the last bit');
  assertEqual(X.getBit(b64, 5000), false, 'getBit past the end is false, not a throw');
  assertEqual(X.getBit('', 3), false, 'getBit on an empty bitmap is false');
})();

(function () {
  var n = 64;
  var st = X.bitsState(X.packBits(new Uint8Array(n), n), n);
  X.setBit(st, 5, true);
  X.setBit(st, 63, true);
  X.setBit(st, 5, false);
  X.setBit(st, 9, true);
  var b64 = X.bitsB64(st);
  var bits = X.unpackBits(b64, n);
  assertEqual([bits[5], bits[9], bits[63], bits[0]], [0, 1, 1, 0], 'setBit sets and clears through a bitsState');
  assertEqual(X.countBits(b64, n), 2, 'setBit leaves exactly two bits set');
  assertEqual(X.getBit(st, 9), true, 'getBit reads a live bitsState without re-decoding');
})();

(function () {
  /* 50,000 progress bits, the size of a 200x250 chart */
  var bits = new Uint8Array(bigN);
  for (var i = 0; i < bigN; i += 3) bits[i] = 1;
  var b64 = X.packBits(bits, bigN);
  assertTrue(b64.length < 9000, '50,000 progress bits fit in under 9 kB of base64 (' + b64.length + ' chars)');
  assertEqual(X.countBits(b64, bigN), Math.ceil(bigN / 3), 'countBits over 50,000 bits is right');
})();

/* =====================================================================
 * 6. Geometry and floss maths
 * ===================================================================== */
group('Geometry and floss maths');

(function () {
  var s = X.finishedSize({ w: 89, h: 74, count: 14, over: 1 });
  assertEqual(s.wIn, 6.36, '89 stitches at 14 ct is 6.36 in');
  assertEqual(s.hIn, 5.29, '74 stitches at 14 ct is 5.29 in');
  assertEqual(s.wCm, 16.1, '89 stitches at 14 ct is 16.1 cm');
  assertEqual(s.fabricIn.w, 12.36, 'fabric to buy adds 6 in on the width');
  assertEqual(s.fabricIn.h, 11.29, 'fabric to buy adds 6 in on the height');
  assertClose(s.fabricCm.w, 31.4, 0.1, 'fabric to buy in cm');

  var ev = X.finishedSize({ w: 89, h: 74, count: 28, over: 2 });
  assertEqual([ev.wIn, ev.hIn], [6.36, 5.29], '28 ct over 2 is the same size as 14 ct aida');

  var none = X.finishedSize({});
  assertEqual([none.wIn, none.hIn], [0, 0], 'finishedSize of an unknown design is 0 x 0, not NaN');
})();

(function () {
  var t = X.sizeTable({ w: 89, h: 74 });
  assertEqual(t.length, 3, 'sizeTable defaults to 14/16/18 ct');
  assertEqual(t[0], { count: 14, wIn: 6.36, hIn: 5.29 }, 'sizeTable row for 14 ct');
  assertEqual(t[1], { count: 16, wIn: 5.56, hIn: 4.63 }, 'sizeTable row for 16 ct');
  assertEqual(t[2], { count: 18, wIn: 4.94, hIn: 4.11 }, 'sizeTable row for 18 ct');
  assertEqual(X.sizeTable({ w: 100, h: 100 }, [11])[0], { count: 11, wIn: 9.09, hIn: 9.09 }, 'sizeTable takes custom counts');
})();

assertEqual(X.lengthPerStitchCm(11, 1), 3.18, 'length per stitch at 11 ct is 3.18 cm');
assertEqual(X.lengthPerStitchCm(14, 1), 2.50, 'length per stitch at 14 ct is 2.50 cm');
assertEqual(X.lengthPerStitchCm(16, 1), 2.19, 'length per stitch at 16 ct is 2.19 cm');
assertEqual(X.lengthPerStitchCm(18, 1), 1.94, 'length per stitch at 18 ct is 1.94 cm');
assertEqual(X.lengthPerStitchCm(22, 1), 1.59, 'length per stitch at 22 ct is 1.59 cm');
assertEqual(X.lengthPerStitchCm(28, 2), 2.50, 'length per stitch at 28 ct over 2 is 2.50 cm');

(function () {
  var base = { count: 14, over: 1, strands: 2 };
  function sk(n, waste) {
    return X.skeinsFor({ stitchCount: n, count: base.count, over: base.over, strands: base.strands, waste: waste });
  }
  assertEqual(sk(960, 0), 1, '960 stitches at 14 ct / 2 strands with no waste is exactly 1 skein');
  assertEqual(sk(961, 0), 2, '961 stitches with no waste tips into a second skein');
  assertEqual(sk(800, 0.2), 1, '800 stitches with 20% waste is exactly 1 skein');
  assertEqual(sk(801, 0.2), 2, '801 stitches with 20% waste tips into a second skein');
  assertEqual(sk(0, 0.2), 0, 'no stitches needs no skeins');
  assertEqual(sk(1, 0.2), 1, 'one stitch still needs a skein');
  assertEqual(X.skeinsFor({ stitchCount: 800, count: 14, strands: 1, waste: 0.2 }), 1,
    'one strand goes twice as far (800 stitches is still 1 skein)');
  assertEqual(X.skeinsFor({ stitchCount: 1601, count: 14, strands: 1, waste: 0.2 }), 2,
    'one strand: 1,601 stitches needs 2 skeins');
  var r = X.skeinRange({ stitchCount: 1234, count: 14, over: 1, strands: 2, waste: 0.2 });
  assertEqual(r, { low: 1, high: 2 }, 'skeinRange for 1,234 stitches is 1-2 skeins');
  assertTrue(r.low <= r.high, 'skeinRange low never exceeds high');
  assertEqual(X.skeinRange({ stitchCount: 0 }), { low: 0, high: 0 }, 'skeinRange of nothing is 0-0');
})();

/* =====================================================================
 * 7. Confetti and progress stats
 * ===================================================================== */
group('Confetti and progress stats');

(function () {
  /* 5 x 5. Colour 0 makes a solid 2x2 block; colours 1, 2 and 3 are single
     isolated stitches; colour 0 also has one isolated stitch far away. */
  var w = 5, h = 5;
  var g = new Int16Array(w * h);
  for (var i = 0; i < g.length; i++) g[i] = -1;
  function set(x, y, v) { g[y * w + x] = v; }
  set(0, 0, 0); set(1, 0, 0); set(0, 1, 0); set(1, 1, 0);   // solid block, not confetti
  set(4, 0, 1);                                            // confetti
  set(4, 4, 2);                                            // confetti
  set(0, 4, 3);                                            // confetti
  set(3, 2, 0);                                            // isolated colour 0 -> confetti
  var chart = { w: w, h: h, cells: X.packCells(g, w, h) };
  var c = X.confetti(chart);
  assertEqual(c.total, 4, 'confetti finds 4 isolated stitches');
  assertEqual(c.byColor[1], 1, 'colour 1 has 1 confetti stitch');
  assertEqual(c.byColor[2], 1, 'colour 2 has 1 confetti stitch');
  assertEqual(c.byColor[3], 1, 'colour 3 has 1 confetti stitch');
  assertEqual(c.byColor[0], 1, 'the 2x2 block is not confetti, but the lone colour-0 stitch is');
  assertEqual(c.byPage, [], 'byPage is empty until pages are known');
  assertEqual(X.confetti(null).total, 0, 'confetti of nothing is 0');
})();

(function () {
  var w = 4, h = 1;
  var g = new Int16Array([0, 0, 1, -1]);
  var bits = new Uint8Array([1, 0, 1, 0]);
  var data = X.normalize({
    palette: [
      { code: '310', name: 'Black', hex: '000000' },
      { code: '666', name: 'Red', hex: 'e31d42' }
    ],
    chart: { w: w, h: h, cells: X.packCells(g, w, h) },
    progress: { mode: 'cells', done: X.packBits(bits, w * h) }
  });
  var st = X.progressStats(data);

group('printableHTML');

function printData(w, h, palette, fill) {
  var cells = new Int16Array(w * h);
  for (var i = 0; i < cells.length; i++) cells[i] = fill(i % w, Math.floor(i / w));
  return X.normalize({
    design: { w: w, h: h, title: 'Tiny sampler', designer: 'Someone' },
    fabric: { count: 14, kind: 'aida', color: 'White' },
    palette: palette,
    chart: { w: w, h: h, cells: cells },
    strandsDefault: 2
  }, null);
}

function parseHtml(html) {
  return new DOMParser().parseFromString(html, 'text/html');
}

(function () {
  var data = printData(20, 20, [{ code: '310' }, { code: '666' }], function (x, y) {
    return (x + y) % 2 === 0 ? 0 : 1;
  });
  var html = X.printableHTML(data, { stitchesPerPage: { w: 10, h: 10 } });
  var doc = parseHtml(html);

  assertTrue(html.indexOf('<!DOCTYPE html>') === 0, 'printableHTML returns a whole document');
  assertEqual(doc.title, 'Tiny sampler', 'the document title is the design title');

  /* one glyph per filled cell, across all four pages */

/* =====================================================================
 * 15. extractGrid (B3.4, beta)
 * ===================================================================== */
group('extractGrid: lattice, rulers and frequency matching');

/* pdf.js operator numbers, matching the fallback table in xstitch.js. */
var OP = { save: 10, restore: 11, transform: 12, rect: 19, path: 91, rgb: 59 };

/** A fake pdf.js document over hand-built pages. */
function fakeDoc(pages) {
  return {
    numPages: pages.length,
    getPage: function (n) {
      var p = pages[n - 1] || { ops: [], items: [] };
      return Promise.resolve({
        getOperatorList: function () {
          var fn = [], args = [];
          (p.ops || []).forEach(function (o) { fn.push(o[0]); args.push(o[1]); });
          return Promise.resolve({ fnArray: fn, argsArray: args });
        },
        getTextContent: function () { return Promise.resolve({ items: p.items || [] }); },
        cleanup: function () { /* no-op */ }
      });
    }
  };
}

function textItem(s, x, y, font) {
  return { str: s, transform: [1, 0, 0, 1, x, y], width: 3, height: 3, fontName: font || 'f2' };
}

var CELL = 8, PX0 = 100, PY0 = 60;

/**
 * A chart tile drawn the way KG-Chart draws one: a coloured square per stitch
 * (optionally four quarter-squares), plus ruler numbers every 10 in the margins.
 * `colorAt(col, row)` takes ABSOLUTE design coordinates.
 */
function tilePage(o) {
  var ops = [], items = [];
  var K = o.quarters ? 2 : 1;
  var unit = CELL / K;
  var x, y, kx, ky;
  for (y = 0; y < o.rows; y++) {
    for (x = 0; x < o.cols; x++) {
      var rgb = o.colorAt(o.col + x, o.row + y);
      if (!rgb) continue;
      ops.push([OP.rgb, rgb]);
      for (ky = 0; ky < K; ky++) {
        for (kx = 0; kx < K; kx++) {
          ops.push([OP.path, [[OP.rect], [
            PX0 + x * CELL + kx * unit,
            PY0 + (o.rows - 1 - y) * CELL + (K - 1 - ky) * unit,
            unit * 0.96, unit * 0.96
          ]]]);
        }
      }
    }
  }
  if (!o.noRulers) {
    for (x = 0; x < o.cols; x++) {
      var ax = o.col + x + 1;
      if (ax % 10) continue;
      items.push(textItem(String(ax), PX0 + x * CELL, PY0 + o.rows * CELL + 12));
      items.push(textItem(String(ax), PX0 + x * CELL, PY0 - 12));
    }
    for (y = 0; y < o.rows; y++) {
      var ay = o.row + y + 1;
      if (ay % 10) continue;
      items.push(textItem(String(ay), PX0 - 14, PY0 + (o.rows - 1 - y) * CELL));
      items.push(textItem(String(ay), PX0 + o.cols * CELL + 6, PY0 + (o.rows - 1 - y) * CELL));
    }
  }
  items.push(textItem('Page footer', PX0 + 100, 20));
  return { ops: ops, items: items };
}

/* Three colours with deliberately different areas, so the frequency ranking
   has something unambiguous to lock onto. */
var RGB = [[10, 20, 30], [200, 40, 40], [250, 250, 250]];
function designColor(col, row) {
  if (col < 6) return RGB[1];
  if (row < 4) return RGB[2];
  return RGB[0];
}
function designCounts(w, h) {
  var n = [0, 0, 0];
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {
      var c = designColor(x, y);
      n[c === RGB[0] ? 0 : (c === RGB[1] ? 1 : 2)]++;
    }
  }
  return n;
}

var GW = 40, GH = 30, TW = 20, TH = 15;
var counts = designCounts(GW, GH);

function chartPages(opt) {
  opt = opt || {};
  var pages = [{ ops: [], items: [textItem('Cover page', 200, 700)] }];
  for (var ty = 0; ty < GH / TH; ty++) {
    for (var tx = 0; tx < GW / TW; tx++) {
      pages.push(tilePage({
        col: tx * TW, row: ty * TH, cols: TW, rows: TH,
        colorAt: designColor, quarters: opt.quarters, noRulers: opt.noRulers
      }));
    }
  }
  return pages;
}

var synthKey = {
  strandsDefault: 2,
  design: { w: GW, h: GH },
  entries: [
    { code: '310', name: 'Black', hex: '0a141e', stitchCount: counts[0], symbol: '', strands: 2, kind: 'cross' },
    { code: '666', name: 'Red', hex: 'c82828', stitchCount: counts[1], symbol: '', strands: 2, kind: 'cross' },
    { code: 'B5200', name: 'Snow', hex: 'fafafa', stitchCount: counts[2], symbol: '', strands: 2, kind: 'cross' }
  ]
};

/* --- the pure helpers, on their own --------------------------------- */
(function () {
  var vals = [], i;
  for (i = 0; i < 60; i++) vals.push(137.5 + i * 7.36 + (i % 3 === 0 ? 0.04 : -0.03));
  for (i = 0; i < 8; i++) vals.push(137.5 + i * 3.1);      // off-lattice noise
  var fit = X._grid.combFit(vals, 7.4);
  assertTrue(Math.abs(fit.pitch - 7.36) < 0.05,
    'combFit recovers the lattice pitch through noise', 'got ' + fit.pitch.toFixed(3));
  var off = ((fit.origin - 137.5) / fit.pitch) % 1;
  assertTrue(Math.min(Math.abs(off), 1 - Math.abs(off)) < 0.05,
    'and the lattice origin to within a twentieth of a cell', 'got ' + fit.origin.toFixed(2));
  assertTrue(fit.strength > 0.8, 'with a strong comb score', 'got ' + fit.strength.toFixed(2));
  assertEqual(X._grid.combFit([1, 2], 7), null, 'combFit refuses two points');
})();

(function () {
  var marks = [], x, y;
  for (y = 0; y < 14; y++) {
    for (x = 0; x < 12; x++) marks.push({ x: 50 + x * 6, y: 90 + y * 6, id: 'aabbcc' });
  }
  var lat = X._grid.latticeOf(marks, 6);
  assertTrue(!!lat, 'latticeOf accepts a clean 12x14 lattice of marks');
  assertEqual([lat.cols, lat.rows], [12, 14], 'and gets the shape right');
  assertEqual(lat.snapPct, 1, 'with every mark snapped');
  assertEqual(X._grid.latticeOf(marks.slice(0, 20), 6), null,
    'and refuses a handful of marks that could be anything');
})();

(function () {
  var marks = [
    { id: 'aa', n: 900 }, { id: 'bb', n: 300 }, { id: 'cc', n: 61 }
  ];
  var entries = [
    { code: '310', stitchCount: 900, symbol: '' },
    { code: '666', stitchCount: 300, symbol: '' },
    { code: '777', stitchCount: 60, symbol: '' }
  ];
  var map = X._grid.matchGlyphs(marks, entries);
  assertEqual([map.aa, map.bb, map.cc], [0, 1, 2],
    'matchGlyphs pairs marks to key entries by stitch count, within 3%');

  var bySymbol = X._grid.matchGlyphs(
    [{ id: 'f2★', n: 5 }, { id: 'f2x', n: 900 }],
    [{ code: '310', stitchCount: 900, symbol: 'x' }, { code: '666', stitchCount: 5, symbol: '★' }]
  );
  assertEqual([bySymbol['f2★'], bySymbol['f2x']], [1, 0],
    'a symbol the key printed wins over the frequency ranking');

  var merged = X._grid.matchGlyphs(
    [{ id: 'aa', n: 1000 }, { id: 'bb', n: 40 }],
    [{ code: '1', stitchCount: 600, symbol: '' }, { code: '2', stitchCount: 400, symbol: '' },
     { code: '3', stitchCount: 40, symbol: '' }]
  );
  assertEqual(merged.bb, 2,
    'two colours sharing one ink do not throw the rest of the ranking out of step');
})();

/* --- the whole path, over a fake document --------------------------- */
var gridTests = X.extractGrid(fakeDoc(chartPages()), null, { key: synthKey })
  .then(function (r) {
    assertEqual(r.ok, true, 'extractGrid reads a synthetic four-tile chart');
    assertEqual([r.w, r.h], [GW, GH], 'the tiles are placed by their ruler numbers');
    assertEqual(r.tiles, 4, 'all four tiles were found');
    assertEqual(r.colors, 3, 'three distinct inks');
    assertEqual(r.matched, 3, 'all three matched a colour in the key');
    assertEqual(r.agree + '/' + r.countable, '3/3', 'and every count agrees within 2%');
    assertEqual(r.filled, GW * GH, 'every cell came back');
    assertEqual(r.confidence, 1, 'confidence 1');
    assertEqual(r.warnings, [], 'with nothing to warn about');
    assertEqual(r.palette.length, 3, 'a palette is built from the key');
    assertEqual(r.palette.map(function (p) { return p.stitchCount; }), counts,
      'and each entry carries the count actually found in the grid');
    var seen = [0, 0, 0];
    for (var i = 0; i < r.cells.length; i++) if (r.cells[i] >= 0) seen[r.cells[i]]++;
    assertEqual(seen, counts, 'the cells themselves hold the right palette indices');
    assertEqual(r.cells[0], 1, 'the top-left cell is the red block');
    assertEqual(r.cells[GW * GH - 1], 0, 'and the bottom-right is the black one');
    return X.extractGrid(fakeDoc(chartPages({ quarters: true })), null, { key: synthKey });
  })
  .then(function (r) {
    assertEqual(r.ok, true, 'a chart drawn as 2x2 quarter squares reads too');
    assertEqual([r.w, r.h], [GW, GH], 'and the quarter squares are merged back into stitches');
    assertEqual(r.filled, GW * GH, 'with the same number of cells');
    return X.extractGrid(fakeDoc(chartPages({ noRulers: true })), null,
      { key: synthKey, design: { w: GW, h: GH } });
  })
  .then(function (r) {
    assertEqual([r.w, r.h], [GW, GH], 'with no ruler numbers the tiles fall back to page order');
    assertTrue(r.warnings.join(' ').indexOf('page order') >= 0, 'and that is said out loud');
    assertEqual(r.filled, GW * GH, 'and the grid is still complete');
    return X.extractGrid(fakeDoc([
      { ops: [], items: [textItem('A colour key, no chart', 100, 700)] },
      { ops: [], items: [textItem('310 Black (1200 ct)', 100, 600)] },
      { ops: [], items: [] }, { ops: [], items: [] },
      { ops: [], items: [] }, { ops: [], items: [] }, { ops: [], items: [] }
    ]), null, { key: synthKey });
  })
  .then(function (r) {
    assertEqual(r.ok, false, 'a PDF with no grid at all reports ok:false');
    assertEqual(r.warnings, ['no chart grid found in this PDF'], 'and says so plainly');
    assertEqual(r.w, 0, 'with no size');
    assertTrue(r.pages <= 6, 'giving up after a handful of pages rather than reading them all',
      'scanned ' + r.pages);
    return X.extractGrid(fakeDoc(chartPages()), null, { key: { entries: [] } });
  })
  .then(function (r) {
    assertEqual(r.ok, false, 'a grid with no key to check it against is not accepted');
    assertTrue(r.warnings.join(' ').indexOf('no colour key') >= 0, 'and says why');
    assertEqual([r.w, r.h], [GW, GH], 'though the grid itself was read');
    var wrong = {
      strandsDefault: 2, design: { w: GW, h: GH },
      entries: [
        { code: '310', hex: '0a141e', stitchCount: 5, symbol: '', strands: 2 },
        { code: '666', hex: 'c82828', stitchCount: 7, symbol: '', strands: 2 },
        { code: 'B5200', hex: 'fafafa', stitchCount: 9, symbol: '', strands: 2 }
      ]
    };
    return X.extractGrid(fakeDoc(chartPages()), null, { key: wrong });
  })
  .then(function (r) {
    assertEqual(r.ok, false, 'a key whose counts do not match the grid is rejected');
    assertTrue(r.warnings.join(' ').indexOf('only agree') >= 0,
      'with the agreement percentage in the warning');
    return X.extractGrid(fakeDoc(chartPages()), 2, { key: synthKey });
  })
  .then(function (r) {
    assertEqual([r.w, r.h], [TW, TH], 'a single page number reads just that page');
    assertEqual(r.tiles, 1, 'as one tile');
    var seenP = 0, total = 0;
    return X.extractGrid(fakeDoc(chartPages()), null, {
      key: synthKey,
      onProgress: function (n, t) { seenP = n; total = t; }
    }).then(function () {
      assertEqual([seenP, total], [5, 5], 'onProgress is called for every page');
      var stop = 0;
      return X.extractGrid(fakeDoc(chartPages()), null, {
        key: synthKey,
        cancelled: function () { return (stop++) > 1; }
      });
    });
  })
  .then(function (r) {
    assertEqual(r.ok, false, 'cancelling mid-run returns ok:false');
    assertTrue(r.warnings.indexOf('cancelled') >= 0 ||
      r.warnings.indexOf('no chart grid found in this PDF') >= 0,
      'without pretending it read anything');
    /* One glyph per stitch: the path the spec originally assumed. */
    var pages = [{ ops: [], items: [textItem('Cover', 200, 700)] }];
    var glyphs = ['a', 'b', 'c'];
    for (var ty = 0; ty < GH / TH; ty++) {
      for (var tx = 0; tx < GW / TW; tx++) {
        var pg = tilePage({ col: tx * TW, row: ty * TH, cols: TW, rows: TH, colorAt: designColor });
        pg.ops = [];
        for (var y = 0; y < TH; y++) {
          for (var x = 0; x < TW; x++) {
            var c = designColor(tx * TW + x, ty * TH + y);
            var gi = c === RGB[0] ? 0 : (c === RGB[1] ? 1 : 2);
            pg.items.push(textItem(glyphs[gi], PX0 + x * CELL, PY0 + (TH - 1 - y) * CELL, 'g' + gi));
          }
        }
        pages.push(pg);
      }
    }
    return X.extractGrid(fakeDoc(pages), null, { key: synthKey });
  })
  .then(function (r) {
    assertEqual(r.ok, true, 'a chart that puts one text glyph per stitch also reads');
    assertEqual([r.w, r.h], [GW, GH], 'at the right size');
    assertEqual(r.filled, GW * GH, 'with every glyph snapped to a cell');
    assertEqual(r.matched, 3, 'and the glyphs matched to the key');
    return X.extractGrid(null, 0, {});
  })
  .then(function (r) {
    assertEqual(r.ok, false, 'extractGrid on nothing at all resolves ok:false');
    assertEqual(r.warnings, ['no PDF to read'], 'and says there was no PDF');
    assertEqual(r.cells.length, 0, 'with an empty cell array, never undefined');
  });

gridTests.then(function () { finish(); }, function (e) {
  log(false, 'the extractGrid chain threw', String(e && e.message ? e.message : e));
  finish();
});

group('Performance');

note('packCells 200x250 (50,000 cells): ' + packTime.toFixed(1) + ' ms');
note('unpackCells 200x250 (50,000 cells): ' + unpackTime.toFixed(1) + ' ms');
assertTrue(packTime < 20, 'packCells on a 200x250 random grid is under 20 ms (' + packTime.toFixed(1) + ' ms)');
assertTrue(unpackTime < 20, 'unpackCells on a 200x250 random grid is under 20 ms (' + unpackTime.toFixed(1) + ' ms)');

function bigChartXml(w, h, comment, reordered) {
  var parts = [];
  parts.push('<?xml version="1.0" encoding="UTF-8"?><chart>');
  parts.push('<properties chartwidth="' + w + '" chartheight="' + h + '" charttitle="Big" stitchesperinch="18" />');
  parts.push('<palette><palette_item index="0" number="cloth" name="cloth" color="FFFFFF"/>');
  for (var p = 1; p <= 20; p++) {
    parts.push('<palette_item index="' + p + '" number="DMC 310" name="C' + p + '" color="123456" strands="2"/>');
  }
  parts.push('</palette><fullstitches>');
  if (comment) parts.push('<!-- a comment inside fullstitches disables the fast scanner -->');
  for (var y = 1; y <= h; y++) {
    for (var x = 1; x <= w; x++) {
      /* 8x8 blocks of colour, so the RLE behaves like a real chart */
      var pi = 1 + (((x >> 3) + (y >> 3)) % 20);
      var mk = (x === 1 && y === 1) ? ' marked="true"' : '';
      parts.push(reordered
        ? '<stitch palindex="' + pi + '" y="' + y + '" x="' + x + '"' + mk + '/>'
        : '<stitch x="' + x + '" y="' + y + '" palindex="' + pi + '"' + mk + '/>');
    }
  }
  parts.push('</fullstitches><backstitches></backstitches></chart>');
  return parts.join('');
}

(function () {
  /* Both parseOXS paths must agree: the regex fast path (no comment) and the
     plain DOM path (a comment inside <fullstitches> disables the fast path). */
  var a = X.parseOXS(bigChartXml(120, 120, false, false));
  var b = X.parseOXS(bigChartXml(120, 120, true, false));
  var c = X.parseOXS(bigChartXml(120, 120, false, true));
  assertTrue(a.ok && b.ok && c.ok, 'all three parseOXS paths accept a 120x120 chart');
  assertEqual(a.data.chart.cells.data, b.data.chart.cells.data, 'the fast scanner and the DOM path produce identical cells');
  assertEqual(c.data.chart.cells.data, b.data.chart.cells.data, 'reordered attributes fall back to the generic scan and still agree');
  assertEqual(a.data.progress.done, b.data.progress.done, 'both paths produce the same done bitmap');
  assertEqual(c.data.progress.done, b.data.progress.done, 'the generic scan keeps marked stitches too');
  assertEqual(a.data.palette.map(function (p) { return p.stitchCount; }),
    b.data.palette.map(function (p) { return p.stitchCount; }), 'both paths produce the same stitch counts');
})();

(function () {
  /* A 500 x 700 chart: 350,000 cells, every one stitched. */
  var xml = bigChartXml(500, 700, false, false);

  var t0 = performance.now();
  var big = X.parseOXS(xml);
  var ms = performance.now() - t0;

  var tD = performance.now();
  new DOMParser().parseFromString(xml, 'application/xml');
  var domMs = performance.now() - tD;

  note('DOMParser alone on the same 12.7 MB of XML: ' + domMs.toFixed(0) + ' ms (this is why the fast scanner exists)');
  note('parseOXS on a 500x700 chart (350,000 stitches, ' + (xml.length / 1048576).toFixed(1) + ' MB of XML): ' + ms.toFixed(0) + ' ms');
  assertEqual(big.ok, true, 'a 350,000-cell chart parses');
  assertEqual(big.data.chart.w * big.data.chart.h, 350000, 'the big chart has 350,000 cells');
  assertEqual(big.data.progress.doneCount, 1, 'the marked stitch survives the fast path');
  assertTrue(ms < 300, 'parseOXS on a 350,000-cell chart is under 300 ms (' + ms.toFixed(0) + ' ms)');
})();

  var el = document.getElementById('summary');
  el.textContent = passed + ' passed, ' + failed + ' failed  (' + (passed + failed) + ' assertions)';
  el.className = failed ? 'bad' : 'ok';
  console.log(el.textContent);
}
